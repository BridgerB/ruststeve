# CI on the runners (issue #6). Every push to main or an issue branch and every PR into main runs
# format, lint, tests, the brain checker and the core-crate dependency boundary, in parallel.
# The Mac never runs code; this is where code runs. Notes: brain/ruststeve/design/ci-on-runners.md
name: ci

on:
  push:
    branches: [main, "issue-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Incremental compilation only adds overhead and cache churn on a fresh runner.
  CARGO_INCREMENTAL: 0
  # No debug info for dev and test builds: a smaller target/ and a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  # -D warnings goes on the clippy command line only: RUSTFLAGS would change every cache key.

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          # Only main writes the cache; branches and PRs restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass

  brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: the ruststeve-v1 source is read from this repository at its pinned commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - name: Fetch the sibling sources at their pins (brain/sources)
        run: |
          set -euo pipefail
          fetch_source() {
            local name="$1" repo="$2" dir="$3"
            local pin
            pin=$(awk -v n="$name" '$1 == n { print $3 }' brain/sources)
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/$repo.git"
            git -C "$dir" fetch -q --depth=1 origin "$pin"
            echo "$name $pin -> $dir"
          }
          fetch_source clojurecraft BridgerB/clojurecraft "$RUNNER_TEMP/clojurecraft"
          fetch_source steve BridgerB/steve "$RUNNER_TEMP/steve"
          echo "CLOJURECRAFT_DIR=$RUNNER_TEMP/clojurecraft" >> "$GITHUB_ENV"
          echo "STEVE_DIR=$RUNNER_TEMP/steve" >> "$GITHUB_ENV"
      - run: cargo run -q --locked -p brain-check -- --strict

  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: cargo run -q --locked -p xtask -- deps-boundary

  # Done-condition 2 of issue 08: the bot walks 1,000 generated worlds against the server model
  # (crates/bot/tests/worlds.rs), in release: a debug build is too slow for 1,000.
  worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worlds
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --release --locked -p bot --test worlds -- --nocapture
        env:
          RUSTSTEVE_WORLDS: "1000"

  # Issue 09: the planner in the captured landings against the server model. Done-conditions:
  # 95% of 200 qualifying landings reach a log 30+ blocks away, no walk 1,200 ticks without
  # progress, and the planner's CPU per tick within config/race.toml's budget, measured here in
  # release. The worlds are captured once from a fresh server on the race seed and cached by the
  # landing list.
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATAGEN_WORK: ${{ github.workspace }}/../datagen-work
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worlds
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: worlds
        uses: actions/cache@v4
        with:
          path: landings
          key: landings-26.1.2-${{ hashFiles('config/landings-grid.toml') }}
      - run: cargo build -q --release --locked -p bot -p xtask
      - if: steps.worlds.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - if: steps.worlds.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATAGEN_WORK }}
          key: datagen-work-26.1.2-v1
      - name: Capture the landings (cache miss only)
        if: steps.worlds.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ ! -f "$DATAGEN_WORK/server.jar" ]; then
            cargo run -q --locked -p datagen -- generate --work "$DATAGEN_WORK" --out "$RUNNER_TEMP/generated"
          fi
          pw="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          echo "::add-mask::$pw"
          RUSTSTEVE_RCON_PASSWORD="$pw" nohup ./target/release/xtask server --jar "$DATAGEN_WORK/server.jar" --difficulty peaceful --view-distance 5 > server.log 2>&1 &
          for _ in $(seq 1 180); do grep -q 'Done (' server.log && break; sleep 2; done
          RUSTSTEVE_RCON_PASSWORD="$pw" ./target/release/capture --landings config/landings-grid.toml --out landings 2>&1 | tail -5
      - name: The measure
        run: |
          set -o pipefail
          ./target/release/simrace --landings-file config/landings-grid.toml --worlds landings \
            --goal log:30 --ticks 3000 --want 200 --check true --report walk.md
      - if: always()
        run: cat walk.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # One stable check name for branch protection.
  ci-ok:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [fmt, clippy, test, brain, boundary, worlds, walk]
    if: always()
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
