# The real race (issue #12, brain/ruststeve/design/race-and-results.md): one vanilla 26.1.2
# server per runner, a lane of bots on it, a start from config/starts.toml, caps in server ticks.
# Every lane uploads its batch, cases, recordings and server log; publish sums k/n per stage and
# commit into the job summary and a release. Runners never stream to steve (the live view is
# local only). Dispatch only:
#   gh workflow run race.yml --ref <branch> -f lanes=4 -f bots=14 -f start=spawn -f cap=6000
# Seeds and the relay (issue 69, brain/ruststeve/design/relay.md): `seed` picks worlds from
# config/seeds.toml and `lanes` is then per seed; `relay=true` chains legs, each seed resuming
# from its own furthest snapshot, until every seed wins or stalls or `legs` is reached. The
# choices are made by the seed-relay binary (crates/xtask/src/bin/seed-relay.rs).
name: race
run-name: "race: ${{ inputs.lanes }} lanes x ${{ inputs.bots }} bots, ${{ inputs.start }}, cap ${{ inputs.cap }}, goal ${{ inputs.goal }}, hold ${{ inputs.hold }}${{ inputs.seed != '' && format(', seed {0}', inputs.seed) || '' }}${{ inputs.relay == 'true' && format(', relay leg {0}/{1}', inputs.leg, inputs.legs) || '' }}"

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: Lanes per seed, one runner each (at most 20 in all)
        default: "4"
      seed:
        description: Seeds from config/seeds.toml - a name, names joined by commas, or all - or empty for config/race.toml's seed
        default: ""
      relay:
        description: Relay - after this race, race each seed again from its furthest snapshot until it wins or stalls (true or false)
        default: "false"
      legs:
        description: The relay's most legs
        default: "6"
      leg:
        description: This leg of the relay (the relay sets it)
        default: "1"
      relay_from:
        description: The previous leg's release tag (race-<run>); the relay sets it
        default: ""
      bots:
        description: Bots per lane (config/race.toml says 14)
        default: "14"
      start:
        description: A start from config/starts.toml
        default: spawn
      cap:
        description: Cap per run in server ticks (6000 = 5 game minutes)
        default: "6000"
      goal:
        description: The planner's aim (log, log:<min> or table), or empty for idle bots
        default: ""
      hold:
        description: Keep each bot living after its aim is met, to the cap (true or false)
        default: "false"
      snapshot:
        description: Resume from a snapshot (one-bot-first) - frontier, or <release tag>/<asset> - or empty for the start's own place
        default: ""
      revive:
        description: Respawn after a death and play on, to the cap (true or false)
        default: "false"
      snapshot_at:
        description: Take a snapshot once a bot has played this many server ticks (not a stage's - named snapshot-at-<ticks>), or empty
        default: ""
      minutes:
        description: The lane job's timeout; bots still running 10 minutes before it end Cut (72,000 ticks, a game hour, needs over 60 of play)
        default: "60"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  # An absolute path with no "..": actions/cache refuses to save a path with relative parts
  # (datagen run 44386256865: "Relative pathing '.' and '..' is not allowed"), so the old
  # workspace/../datagen-work was never saved and every lane fetched the jar again.
  DATAGEN_WORK: /home/runner/work/datagen-work

jobs:
  lanes:
    name: lanes
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      total: ${{ steps.m.outputs.total }}
      race_minutes: ${{ steps.m.outputs.race_minutes }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: race
          save-if: false
      - name: Build the seed tools
        run: cargo build -q --locked --release -p xtask

      # The previous leg's relay-<seed>.toml files (issue 69): each seed's furthest snapshot.
      - name: The previous leg
        if: inputs.relay == 'true' && inputs.relay_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELAY_FROM: ${{ inputs.relay_from }}
        run: |
          set -euo pipefail
          gh release download "$RELAY_FROM" -p 'relay-*.toml' -D prev
          for f in prev/relay-*.toml; do echo "== $f"; cat "$f"; done

      - id: m
        env:
          LANES: ${{ inputs.lanes }}
          CAP: ${{ inputs.cap }}
          MINUTES: ${{ inputs.minutes }}
          SEED: ${{ inputs.seed }}
          START: ${{ inputs.start }}
          SNAPSHOT: ${{ inputs.snapshot }}
          RELAY: ${{ inputs.relay }}
        run: |
          set -euo pipefail
          if ! [[ "$LANES" =~ ^[0-9]+$ ]] || [ "$LANES" -lt 1 ] || [ "$LANES" -gt 20 ]; then
            echo "lanes must be 1 to 20, got $LANES"; exit 1
          fi
          # Pre-flight (issue 16e): the cap must fit the job. 20 server ticks a second at best, 5
          # minutes to build and start the server, 15 kept for the end (race 44942537213 left
          # minutes at 60 under a 3-hour cap and every lane was cut).
          need=$(( CAP / 20 / 60 + 5 + 15 ))
          if [ "$MINUTES" -lt "$need" ]; then
            echo "cap $CAP needs minutes >= $need (got $MINUTES): every bot would be cut"; exit 1
          fi
          # Seeds x lanes (issue 69): every lane's seed, start and snapshot, at most 20 lanes in
          # all, refused when another seed is asked for a place on the race seed's world.
          from=""
          if [ "$RELAY" = true ] && [ -d prev ]; then from=prev; fi
          ./target/release/seed-relay lanes --names "$(./target/release/xtask seeds)" \
            --seed "$SEED" --lanes "$LANES" --start "$START" --snapshot "$SNAPSHOT" \
            --from "$from" --lanes-toml lanes.toml >> "$GITHUB_OUTPUT"
          cat lanes.toml
          # The race step's own limit (expressions cannot subtract): 9 minutes under the job's,
          # so the steps after it (the lane's files, the replay) always get their time.
          echo "race_minutes=$(( MINUTES - 9 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: race-${{ github.run_id }}-lanes-toml
          path: lanes.toml
          retention-days: 30

      # The release opens now, so each lane's progress is readable while the race runs (16e).
      # Its tag points at the default branch: the workflow token may not tag a commit that changes
      # workflow files (race 44998112179's publish failed 403 so); each batch and case records
      # the commit it ran.
      - name: Open the release for progress
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "race-${{ github.run_id }}" --target "${{ github.event.repository.default_branch }}" --prerelease \
            --title "race ${{ github.run_id }} (running)" \
            --notes "Running. Every 5 minutes (10 with more than 8 lanes) each lane uploads progress-lane-N.txt, a line per bot (stage, health, food, held item and uses, task and reason, ticks without progress), and evidence-lane-N.tar.zst, each bot's ledger, senses and story so far as text. A snapshot is uploaded within a minute of its stage being reached. lanes.toml says each lane's seed."
          gh release upload "race-${{ github.run_id }}" lanes.toml --clobber

  lane:
    needs: lanes
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: ${{ fromJSON(inputs.minutes) }}
    strategy:
      fail-fast: false
      # One row a lane (issue 69): lane (numbered on through the seeds), seed, start, snapshot
      # (tag/asset or empty) and source (frontier, relay, given or empty), from seed-relay.
      matrix:
        include: ${{ fromJSON(needs.lanes.outputs.matrix) }}
    env:
      SEED: ${{ matrix.seed }}
    steps:
      - name: Mark the job's start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # The release build's dependencies, saved once by lane 0 (a cache is saved only when its
      # key is new) and restored by every later lane of the branch: the old key was the datagen
      # workflow's debug build, restore only, so every lane built everything.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: race
          save-if: ${{ matrix.lane == 0 }}
      - id: work
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATAGEN_WORK }}
          key: datagen-work-26.1.2-v2

      - name: Get the server jar if the cache missed
        run: |
          if [ ! -f "$DATAGEN_WORK/server.jar" ]; then
            cargo run -q --locked -p datagen -- generate --work "$DATAGEN_WORK" --out "$RUNNER_TEMP/generated"
          fi

      - name: Keep the server jar for later lanes
        if: steps.work.outputs.cache-hit != 'true' && matrix.lane == 0
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATAGEN_WORK }}
          key: datagen-work-26.1.2-v2

      - name: Build
        run: cargo build -q --locked --release -p xtask -p bot -p results -p replay -p rcon

      - name: Restore the snapshot into the server's world
        if: matrix.snapshot != ''
        env:
          SNAPSHOT: ${{ matrix.snapshot }}
          SOURCE: ${{ matrix.source }}
          LANE: ${{ matrix.lane }}
          BOTS: ${{ inputs.bots }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Every bot of the lane takes the snapshot bot's player file (items, position, dimension,
        # health) under its own offline UUID; the race seeds each with the snapshot's memory.
        run: |
          set -euo pipefail
          # seed-relay resolved the frontier (config/frontier.toml, or config/frontier/<seed>.toml)
          # or the relay's last leg to tag/asset; SOURCE says which.
          tag="${SNAPSHOT%%/*}"
          asset="${SNAPSHOT#*/}"
          echo "snapshot ($SOURCE, seed $SEED): $tag $asset"
          mkdir -p snap target/server
          gh release download "$tag" -p "$asset" -D snap
          tar --zstd -xf "snap/$asset" -C snap
          dir="$(dirname "$(find snap -name snap.toml | head -n 1)")"
          cat "$dir/snap.toml"
          # A snapshot of another seed's world is refused (race.yml prepends seed = to each).
          snap_seed="$(sed -n 's/^seed = "\(.*\)"$/\1/p' "$dir/snap.toml" | head -n 1)"
          if [ -n "$snap_seed" ] && [ "$snap_seed" != "$SEED" ]; then
            echo "::error::lane $LANE races seed $SEED but $tag/$asset is a snapshot of seed $snap_seed: refused"
            exit 1
          fi
          # The frontier (or a relay leg) is never a development snapshot (bot::devstart): one
          # made by a race from a made-up start, marked dev in its snap.toml and dev- in its name.
          if [ "$SOURCE" != given ] && { grep -q '^dev = true' "$dir/snap.toml" || [[ "$asset" == dev-* ]]; }; then
            echo "::error::the $SOURCE snapshot ($tag/$asset) is a development snapshot: refused"
            exit 1
          fi
          # Nor a snapshot on request or of a stuck spot (kind = "at" or "stuck"): not a stage's.
          if [ "$SOURCE" != given ] && grep -q '^kind = ' "$dir/snap.toml"; then
            echo "::error::the $SOURCE snapshot ($tag/$asset) is not a stage's snapshot: refused"
            exit 1
          fi
          if grep -q '^dev = true' "$dir/snap.toml"; then
            echo "::notice::lane $LANE resumes a development snapshot: its own snapshots are marked dev and never count as evidence"
          fi
          rm -rf target/server/world
          cp -r "$dir/world" target/server/world
          from="$(sed -n 's/^uuid = "\(.*\)"$/\1/p' "$dir/snap.toml")"
          for i in $(seq 0 $((BOTS - 1))); do
            name="$(printf 'rs-l%02d-b%02d' "$LANE" "$i")"
            to="$(./target/release/results offline-uuid "$name")"
            # The snapshot bot's own name (lane 0, bot 0 of the lane it came from) has its file already.
            if [ "$to" != "$from" ]; then
              cp "target/server/world/players/data/$from.dat" "target/server/world/players/data/$to.dat"
            fi
          done
          echo "SNAP_MEMORY=$dir/memory.rsw" >> "$GITHUB_ENV"

      - name: Start the server (RCON on, a password for this run only)
        env:
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          # A named seed's level-seed from config/seeds.toml (issue 69); no seed input is
          # config/race.toml's, as before. A restored world keeps the seed it was made with.
          seed=()
          if [ -n "$SEED_INPUT" ]; then seed=(--seed "$(./target/release/xtask seed "$SEED")"); fi
          echo "lane seed: $SEED ${seed[*]}"
          pw="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          echo "::add-mask::$pw"
          echo "RUSTSTEVE_RCON_PASSWORD=$pw" >> "$GITHUB_ENV"
          RUSTSTEVE_RCON_PASSWORD="$pw" nohup ./target/release/xtask server --jar "$DATAGEN_WORK/server.jar" "${seed[@]}" > server.log 2>&1 &
          for _ in $(seq 1 180); do
            if grep -q 'Done (' server.log; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1

      # Each lane its own loot rolls (issue 18, docs/problems/pearls-hunt.md): vanilla mob loot
      # draws from per-world random sequences kept in the world (data/minecraft/
      # random_sequences.dat), so every lane restored from one snapshot, or made from one seed,
      # rolled the same pearl at its nth enderman kill: eight lanes were one sample (race
      # 45588764709: 23 kills, 2 pearls, both at the 5th kill in two lanes). The sequence is
      # reset to a seed from the run and the lane: the drop chance is the game's, only the lanes'
      # rolls are independent. Nothing is given to any bot.
      - name: Each lane its own loot rolls
        env:
          LANE: ${{ matrix.lane }}
        # The command is `random reset <sequence> <seed>` (probe 45601982494: "Reset random
        # sequence minecraft:entities/enderman"; `randomsequence` is unknown, and the seed is a
        # 32-bit int). The rcon binary exits 0 on an unknown command, so the reply is checked.
        run: |
          set -euo pipefail
          seed=$(( (GITHUB_RUN_ID % 1000000) * 100 + LANE ))
          reply="$(./target/release/rcon "random reset minecraft:entities/enderman $seed")"
          echo "$reply"
          if ! grep -q 'Reset random sequence' <<< "$reply"; then
            echo "::error::lane $LANE: the enderman loot sequence was not reset"
            exit 1
          fi

      - name: Race the lane
        # Under the job's limit by 9 minutes (the lanes job works it out), and the race itself
        # is ended earlier still from the job's start, so the lane's files always leave.
        timeout-minutes: ${{ fromJSON(needs.lanes.outputs.race_minutes) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANE: ${{ matrix.lane }}
          LANES: ${{ needs.lanes.outputs.total }}
          BOTS: ${{ inputs.bots }}
          START: ${{ matrix.start }}
          CAP: ${{ inputs.cap }}
          GOAL: ${{ inputs.goal }}
          HOLD: ${{ inputs.hold }}
          REVIVE: ${{ inputs.revive }}
          SNAPSHOT_AT: ${{ inputs.snapshot_at }}
          MINUTES: ${{ inputs.minutes }}
        # The wall limit is the job's end, not a cap: bots still running 10 minutes before it end
        # Cut (not counted) and write their files; 7 minutes before it the race is killed. Both
        # are counted from the job's start, so a slow build cannot eat the time the uploads need
        # (races 45164371770 to 45204423376: lanes at the job limit uploaded nothing).
        run: |
          set +e
          set -o pipefail
          goal=()
          if [ -n "$GOAL" ]; then goal=(--goal "$GOAL"); fi
          memory=()
          if [ -n "${SNAP_MEMORY:-}" ]; then memory=(--memory "$SNAP_MEMORY"); fi
          if [ -n "$SNAPSHOT_AT" ]; then memory+=(--snapshot-at "$SNAPSHOT_AT"); fi
          now="$(date +%s)"
          echo "RACE_START=$now" >> "$GITHUB_ENV"
          end=$(( JOB_START + MINUTES * 60 ))
          wall=$(( end - 600 - now ))
          hard=$(( end - 420 - now ))
          if [ "$wall" -lt 60 ]; then wall=60; fi
          if [ "$hard" -lt 120 ]; then hard=120; fi
          echo "race: $(( now - JOB_START )) s of setup; bots end Cut after $wall s, the race is killed after $hard s"
          # While the race runs (issues 16e, 16): every 5 minutes (10 with over 8 lanes: the
          # workflow token has 1,000 requests an hour for the repository, an upload is about 3)
          # the bots' progress lines go to the release as progress-lane-N.txt and their ledgers,
          # senses and stories so far as evidence-lane-N.tar.zst; a snapshot goes within 30
          # seconds of its snap.toml (written last), named as publish names it, so a stage
          # reached is a start for the next race at once and survives a lane that never ends.
          every=300
          if [ "$LANES" -gt 8 ]; then every=600; fi
          # Snapshots not yet sent, packed and added to `files`, their stages to `stages`: a
          # stage is marked sent only once its upload succeeded, so one refused (a 403 rate limit)
          # is packed and sent again on the next turn.
          new_snapshots() {
            for d in "lane-$LANE"/snapshots/*; do
              [ -f "$d/snap.toml" ] || continue
              stage="$(basename "$d")"
              [ -e ".sent-$stage" ] && continue
              # The world's seed name goes first (issue 69): a key after the [items] table would
              # land in it. Once only, since a refused upload is packed again.
              if ! grep -q '^seed = ' "$d/snap.toml"; then
                { echo "seed = \"$SEED\""; cat "$d/snap.toml"; } > "$d/snap.toml.seed" && mv "$d/snap.toml.seed" "$d/snap.toml"
              fi
              prefix=""
              if grep -q '^dev = true' "$d/snap.toml"; then prefix="dev-"; fi
              f="${prefix}snapshot-$stage-${{ github.run_id }}-race-${{ github.run_id }}-lane-$LANE.tar.zst"
              if tar --zstd -C "$(dirname "$d")" -cf "$f" "$stage"; then
                files+=("$f")
                stages+=("$stage")
              fi
            done
          }
          # Upload `files`; on success mark `stages` sent.
          send_files() {
            if gh release upload "race-${{ github.run_id }}" "${files[@]}" --clobber; then
              for s in "${stages[@]}"; do touch ".sent-$s"; done
            else
              echo "::warning::lane $LANE: an upload failed; its snapshots are sent again on the next turn"
            fi
          }
          (
            waited=0
            while sleep 30; do
              waited=$(( waited + 30 ))
              files=()
              stages=()
              new_snapshots
              if [ $(( waited % every )) -eq 0 ]; then
                if cat "lane-$LANE"/progress-*.txt > "progress-lane-$LANE.txt" 2>/dev/null; then
                  files+=("progress-lane-$LANE.txt")
                fi
                if find "lane-$LANE" -maxdepth 1 \( -name '*.ledger.txt' -o -name '*.senses.txt' -o -name '*.case.txt' \) -printf '%f\n' \
                  | tar --zstd -C "lane-$LANE" -T - -cf "evidence-lane-$LANE.tar.zst" 2>/dev/null \
                  && [ -n "$(tar --zstd -tf "evidence-lane-$LANE.tar.zst" 2>/dev/null)" ]; then
                  files+=("evidence-lane-$LANE.tar.zst")
                fi
              fi
              if [ "${#files[@]}" -gt 0 ]; then
                send_files
              fi
            done
          ) &
          uploader=$!
          timeout --kill-after=30 "$hard" ./target/release/race --lane "$LANE" --bots "$BOTS" --start "$START" --cap "$CAP" \
            --run "${{ github.run_id }}" --out "lane-$LANE" --wall-limit "$wall" \
            --hold-after-aim "$HOLD" --revive "$REVIVE" "${goal[@]}" "${memory[@]}" 2>&1 | tee "race-$LANE.log"
          code=$?
          kill "$uploader" 2>/dev/null || true
          wait "$uploader" 2>/dev/null
          # A snapshot of the race's last half minute leaves with this lane, not with the last
          # lane of the race (publish waits for every lane).
          files=()
          stages=()
          new_snapshots
          if [ "${#files[@]}" -gt 0 ]; then
            send_files
          fi
          echo "RACE_END=$(date +%s)" >> "$GITHUB_ENV"
          echo "RACE_EXIT=$code" >> "$GITHUB_ENV"
          # The race's exit never fails the lane (coverage under 1.0 is read in the summary); a
          # kill at the hard limit is said aloud.
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::warning::lane $LANE: the race was killed at the hard limit ($hard s): its batch may be missing"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::lane $LANE: the race exited $code"
          fi
          # A bot the harness lost (an error, a kick, a lost connection) fails the lane, after
          # every upload; a death or a cap is a result, not a failure.
          if grep -qE ': ended (Error|Kicked|Lost) \{' "race-$LANE.log"; then
            echo "::error::lane $LANE: a bot ended by the harness: $(grep -E ': ended (Error|Kicked|Lost) \{' "race-$LANE.log" | head -3)"
            exit 1
          fi
          exit 0

      # The lane's files leave first: nothing after this step can lose them.
      - name: Keep the server log with the lane
        if: always()
        env:
          LANE: ${{ matrix.lane }}
        run: |
          mkdir -p "lane-$LANE"
          cp server.log "lane-$LANE/server.log" || true
          cp "race-$LANE.log" "lane-$LANE/race.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-${{ github.run_id }}-lane-${{ matrix.lane }}
          path: lane-${{ matrix.lane }}
          if-no-files-found: warn
          retention-days: 30

      # After the upload, bounded, and never the lane's failure: its result goes to the job
      # summary, an annotation and verify-lane-N.txt on the release.
      - name: Replay one recording at this commit
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANE: ${{ matrix.lane }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set +e
          set -o pipefail
          f="$(find "lane-$LANE" -name '*.rsr' | sort | head -n 1)"
          if [ -z "$f" ]; then
            echo "lane $LANE: replay verify: no recording" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # At most 5 minutes, and never past a minute before the job's end.
          left=$(( JOB_START + MINUTES * 60 - $(date +%s) - 60 ))
          limit=300
          if [ "$left" -lt "$limit" ]; then limit="$left"; fi
          if [ "$limit" -lt 10 ]; then
            echo "::warning::lane $LANE: replay verify skipped, no time left in the job"
            echo "lane $LANE: replay verify $f: skipped, no time left" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          from="$(date +%s)"
          timeout --kill-after=10 "$limit" ./target/release/replay verify "$f" 2>&1 | tee "verify-lane-$LANE.txt"
          code=$?
          took=$(( $(date +%s) - from ))
          case "$code" in
            0) result="ok" ;;
            124|137) result="TIMED OUT after $limit s" ;;
            *) result="FAILED (exit $code)" ;;
          esac
          line="lane $LANE: replay verify $f: $result, $took s"
          echo "$line" | tee -a "verify-lane-$LANE.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning::$line"
            tail -n 5 "verify-lane-$LANE.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release upload "race-${{ github.run_id }}" "verify-lane-$LANE.txt" --clobber || true
          exit "$code"

      - name: Report the lane's times
        if: always()
        env:
          LANE: ${{ matrix.lane }}
          START: ${{ matrix.start }}
        run: |
          now="$(date +%s)"
          rs="${RACE_START:-$now}"
          re="${RACE_END:-$now}"
          echo "lane $LANE (seed $SEED, start $START): setup $(( rs - JOB_START )) s, race $(( re - rs )) s (exit ${RACE_EXIT:-none}), after the race $(( now - re )) s, job $(( now - JOB_START )) s" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [lanes, lane]
    # Every lane, ended or not; nothing when the pre-flight refused the race.
    if: always() && needs.lanes.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: race
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          pattern: race-${{ github.run_id }}-lane-*
          path: lanes
      # Each lane's seed (issue 69).
      - uses: actions/download-artifact@v4
        with:
          name: race-${{ github.run_id }}-lanes-toml
          path: .

      - name: k/n per stage and commit
        env:
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          cargo run -q --locked --release -p results -- summary lanes | tee summary.md
          # The race's own diagnosis: by place, cast failures, note kinds (results::diagnose).
          cargo run -q --locked --release -p results -- diagnose lanes | tee -a summary.md
          {
            echo
            echo "### lanes (lanes.toml)"
            echo
            echo '```toml'
            cat lanes.toml
            echo '```'
          } | tee -a summary.md
          {
            echo "## race ${{ github.run_id }}: ${{ needs.lanes.outputs.total }} lanes (${{ inputs.lanes }} per seed, seed '$SEED_INPUT') x ${{ inputs.bots }} bots, start ${{ inputs.start }}, cap ${{ inputs.cap }}"
            echo
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the batches as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Batches, cases, ledgers, senses and moments (all small): recordings stay in the lane artifacts.
          find lanes \( -name 'batch.rsb' -o -name '*.case.rsc' -o -name '*.case.txt' -o -name '*.ledger.rsl' -o -name '*.senses.rss' -o -name '*.moments.rsm' -o -name '*.truth.rst' -o -name '*.ledger.txt' -o -name '*.senses.txt' \) -print0 \
            | tar --zstd --null -T - -cf "batches-${{ github.run_id }}.tar.zst"
          # Each lane's snapshots (one-bot-first): the first bot to reach each stage, as an asset.
          snaps=()
          for d in lanes/*/snapshots/* legs/*/snapshots/*; do
            [ -f "$d/snap.toml" ] || continue
            stage="$(basename "$d")"
            src="$(basename "$(dirname "$(dirname "$d")")")"
            # A development race's snapshot (bot::devstart) carries it in its name.
            prefix=""
            if grep -q '^dev = true' "$d/snap.toml"; then prefix="dev-"; fi
            f="${prefix}snapshot-$stage-${{ github.run_id }}-$src.tar.zst"
            tar --zstd -C "$(dirname "$d")" -cf "$f" "$stage"
            snaps+=("$f")
          done
          # The release was opened by the lanes job (issue 16e); an older run without it is made here.
          tag="race-${{ github.run_id }}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "${{ github.event.repository.default_branch }}" --prerelease --notes "publishing"
          fi
          gh release upload "$tag" "batches-${{ github.run_id }}.tar.zst" summary.md lanes.toml "${snaps[@]}" --clobber
          gh release edit "$tag" --title "race ${{ github.run_id }} (${{ inputs.start }}, $(git rev-parse --short HEAD))" \
            --notes-file summary.md

      # The relay reads only each snapshot's snap.toml: a small artifact, not every lane's world.
      - name: The leg's snapshot list
        if: inputs.relay == 'true'
        run: |
          mkdir -p snaps
          find lanes -path '*/snapshots/*/snap.toml' -exec cp --parents -t snaps {} +
          find snaps -name snap.toml | sort
      - uses: actions/upload-artifact@v4
        if: inputs.relay == 'true'
        with:
          name: race-${{ github.run_id }}-snaps
          path: snaps
          if-no-files-found: warn
          retention-days: 30

  # The relay (issue 69, brain/ruststeve/design/relay.md): each seed's furthest stage so far as
  # relay-<seed>.toml on this release, then the next leg on the same ref while any seed is still
  # going and legs are left. A seed leaves the relay when it wins or a leg adds no stage.
  relay:
    needs: publish
    if: always() && inputs.relay == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: race
          save-if: false
      - name: Build the seed tools
        run: cargo build -q --locked --release -p xtask
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: race-${{ github.run_id }}-snaps
          path: snaps
      - name: The previous leg
        if: inputs.relay_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELAY_FROM: ${{ inputs.relay_from }}
        run: gh release download "$RELAY_FROM" -p 'relay-*.toml' -D prev

      - id: r
        name: Each seed's furthest stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEED: ${{ inputs.seed }}
          LEG: ${{ inputs.leg }}
          LEGS: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          from=""
          if [ -d prev ]; then from=prev; fi
          ./target/release/seed-relay record --names "$(./target/release/xtask seeds)" \
            --seed "$SEED" --run "${{ github.run_id }}" --leg "$LEG" --legs "$LEGS" \
            --snaps snaps/lanes --from "$from" --out relay --output "$GITHUB_OUTPUT" | tee relay.md
          cat relay.md >> "$GITHUB_STEP_SUMMARY"
          for f in relay/relay-*.toml; do echo "== $f"; cat "$f"; done
          gh release upload "race-${{ github.run_id }}" relay/relay-*.toml relay.md --clobber

      - name: The next leg
        if: steps.r.outputs.next == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          LEG: ${{ inputs.leg }}
          # Every other input carried over as it was.
          LANES: ${{ inputs.lanes }}
          BOTS: ${{ inputs.bots }}
          START: ${{ inputs.start }}
          CAP: ${{ inputs.cap }}
          GOAL: ${{ inputs.goal }}
          HOLD: ${{ inputs.hold }}
          SNAPSHOT: ${{ inputs.snapshot }}
          REVIVE: ${{ inputs.revive }}
          SNAPSHOT_AT: ${{ inputs.snapshot_at }}
          MINUTES: ${{ inputs.minutes }}
          SEED: ${{ inputs.seed }}
          LEGS: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          NEXT=$(( LEG + 1 ))
          gh workflow run race.yml --ref "$REF" \
            -f lanes="$LANES" -f bots="$BOTS" -f start="$START" -f cap="$CAP" -f goal="$GOAL" \
            -f hold="$HOLD" -f snapshot="$SNAPSHOT" -f revive="$REVIVE" -f snapshot_at="$SNAPSHOT_AT" \
            -f minutes="$MINUTES" -f seed="$SEED" -f relay=true -f legs="$LEGS" \
            -f leg="$NEXT" -f relay_from="race-${{ github.run_id }}"
          echo "dispatched leg $NEXT on $REF from race-${{ github.run_id }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The insight store: add this race to the published store (ingest.yml).
  insight:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/ingest.yml
