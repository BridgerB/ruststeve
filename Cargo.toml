[package]
name = "ruststeve"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Ender Dragon speedrun bot with a built-in Minecraft SDK (formerly the rustcraft crate, now flattened in)"

[lib]
name = "ruststeve"
path = "src/lib.rs"

[[bin]]
name = "ruststeve"
path = "src/main.rs"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[dependencies]
# speedrun bot
rusqlite = { version = "0.31", features = ["bundled"] }
# Minecraft SDK (formerly rustcraft)
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
sha1 = "0.10"
rsa = "0.9"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
