[package]
name = "world"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The world as one value, folded only from what the server sent (no I/O)"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
data = { path = "../data" }
memory = { path = "../memory" }
physics = { path = "../physics" }
protocol = { path = "../protocol" }

[dev-dependencies]
proptest = "1"
