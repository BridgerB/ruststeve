[package]
name = "verify-stream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Connect to a vanilla server and check every packet id it sends is in the generated tables (runs on runners)"

[[bin]]
name = "verify-stream"
path = "src/main.rs"

[dependencies]
anyhow = "1"
data = { path = "../data" }
flate2 = "1"
md-5 = "0.10"
