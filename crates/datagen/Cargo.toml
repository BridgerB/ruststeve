[package]
name = "datagen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Generate crates/data from the vanilla 26.1.2 server: its reports and the data in its jar (runs on runners only)"

[[bin]]
name = "datagen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Mojang's JSON is read with its key order kept: a block's property order decides its state ids.
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
