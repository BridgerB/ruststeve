[package]
name = "replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Fold recordings: replay (verify, export), why (the world at a moment), replan (the planner asked again there)"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "why"
path = "src/bin/why.rs"

[[bin]]
name = "ledger"
path = "src/bin/ledger.rs"

[[bin]]
name = "replan"
path = "src/bin/replan.rs"

[[bin]]
name = "gaze"
path = "src/bin/gaze.rs"

[dependencies]
data = { path = "../data" }
plan = { path = "../plan" }
toml = "1"
protocol = { path = "../protocol" }
observe = { path = "../observe" }
record = { path = "../record" }
results = { path = "../results" }
world = { path = "../world" }

[dev-dependencies]
memory = { path = "../memory" }
