# The issue-20 win's lineage (issue 69): every snapshot the winning world went through, spawn
# first, so `results seeds --lineage` reads one row of game ticks from spawn to each stage.
# Built from `git log -p -- config/frontier.toml` on main (each frontier's `how` names the
# snapshot it resumed from), docs/problems/end.md's ladder (the bow line) and the releases'
# asset lists (2026-11-27). A frontier move that was not resumed from (the fortress of race
# 44678197603, the first rods_7 and endermen lanes, the crystals_5 of the pillar line) is not
# in the chain. Links of the same race and lane are one world at different moments.
seed = "typecraft"

