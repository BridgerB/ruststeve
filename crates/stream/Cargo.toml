[package]
name = "stream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The live snapshot stream to steve's local relay: MessagePack frames over an outbound WebSocket (shell side)"

[dependencies]
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
