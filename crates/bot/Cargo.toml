[package]
name = "bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The bot's loop as a library; the bot binary runs one, the race binary a lane (shell side)"

[[bin]]
name = "bot"
path = "src/main.rs"

[[bin]]
name = "race"
path = "src/bin/race.rs"

[dependencies]
data = { path = "../data" }
net = { path = "../net" }
physics = { path = "../physics" }
protocol = { path = "../protocol" }
rcon = { path = "../rcon" }
record = { path = "../record" }
results = { path = "../results" }
stream = { path = "../stream" }
world = { path = "../world" }
