[package]
name = "ruststeve-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "MCP server giving agents ruststeve's tools: runner probes, CI runs, the brain"

[[bin]]
name = "ruststeve-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
