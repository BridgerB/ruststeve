[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
# `cargo run -p xtask` stays the xtask binary (the hooks and ci.yml use it); seed-relay is the
# second (issue 69).
default-run = "xtask"
description = "Repository automation run in CI (cargo run -p xtask -- <task>)"

[dependencies]
results = { path = "../results" }
# seed-relay (issue 69): the stage ladder's order, and the relay's toml files.
serde = { version = "1", features = ["derive"] }
toml = "1"
world = { path = "../world" }
