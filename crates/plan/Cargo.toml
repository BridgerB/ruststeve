[package]
name = "plan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The planner: tasks, the pathfinder (a port of clojurecraft's path.clj), the walk, progress invariants (no I/O)"

[dependencies]
data = { path = "../data" }
memory = { path = "../memory" }
physics = { path = "../physics" }
serde = { version = "1", features = ["derive"] }
world = { path = "../world" }

[dev-dependencies]
toml = "1"
proptest = "1"
protocol = { path = "../protocol" }
sim = { path = "../sim" }
