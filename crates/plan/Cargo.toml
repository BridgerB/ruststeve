[package]
name = "plan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The planner: tasks, the pathfinder (a port of clojurecraft's path.clj), the walk, progress invariants (no I/O)"

[dependencies]
data = { path = "../data" }
memory = { path = "../memory" }
physics = { path = "../physics" }
# Entity metadata values (an enderman's creepy and stared-at flags, issue 17).
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
# config/keep.toml, compiled in and parsed at construction (issue 77, plan::keep): no I/O.
toml = "1"
world = { path = "../world" }

[dev-dependencies]
proptest = "1"
sim = { path = "../sim" }
# The build differential's fixture is zstd text (issue 14c: 4.9 MB plain).
zstd = "0.13"
