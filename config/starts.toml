# Checkpoint starts as data (brain/ruststeve/design/race-and-results.md): a kit and a place per
# stage, so every lane can play any stage (brain/oracle/handoff/cc-loop-rules.md, the checkpoint
# rule). Every issue adds its row before its gameplay. Items by registry name (no namespace).

[[start]]
name = "spawn"
stage = "in_world"
place = "spawn"

# A fresh start with nothing given (issue 16's clean flow, 2026-11-22): spawn, then each bot to
# a random surface spot within 128 blocks, so a lane's bots do not fell the same trees and dig up
# each other's tables (docs/problems/iron-kit.md wall 4). No kit and no place: not a checkpoint.
[[start]]
name = "fresh"
stage = "in_world"
place = "spawn"
spread = 128

# Proves the kit path (issue 07a): the table stage's kit at spawn.
[[start]]
name = "table"
stage = "table"
place = "spawn"
kit = [["crafting_table", 1], ["oak_log", 4]]

# Issue 13's start: what an issue-12 bot holds when stone tools are made (the hour race's case
# files: a stone pickaxe and sword, the wooden pickaxe, the table carried on, logs, sticks and the
# cobblestone left over), at spawn.
[[start]]
name = "stone"
stage = "stone_pickaxe"
place = "spawn"
kit = [["stone_pickaxe", 1], ["stone_sword", 1], ["wooden_pickaxe", 1], ["crafting_table", 1], ["oak_log", 3], ["stick", 3], ["cobblestone", 4]]
# Each bot to a random surface spot within 128 blocks of spawn: fourteen bots digging one patch
# dug up each other's tables and took each other's drops (docs/problems/iron-kit.md wall 4).
spread = 128

# Issue 14's start (Bridger, 2026-11-15: two buckets, so the race measures water, lava and the cast,
# not more iron): what an issue-13 bot holds with the kit, a second bucket, and the stone tools,
# the table, sticks and cobblestone it kept; spread as the stone start.
[[start]]
name = "kit"
stage = "iron_kit"
place = "spawn"
kit = [["iron_pickaxe", 1], ["bucket", 2], ["flint_and_steel", 1], ["stone_pickaxe", 1], ["stone_sword", 1], ["crafting_table", 1], ["stick", 8], ["cobblestone", 16]]
spread = 128

# Issue 14's checkpoint for the cast: beside lava, the water held, the kit as `kit`; each bot at one
# of `places` in turn: where race bots stood when they chose a cast site, on the race seed. A race
# from here works the site, the cast and the light from its first tick, not after an hour's hunt
# (Bridger, 2026-11-16: start where the work is).
[[start]]
name = "lava"
stage = "iron_kit"
place = "spawn"
kit = [["iron_pickaxe", 1], ["bucket", 1], ["water_bucket", 1], ["flint_and_steel", 1], ["stone_pickaxe", 1], ["stone_sword", 1], ["crafting_table", 1], ["stick", 8], ["cobblestone", 16]]
cap_ticks = 24000
places = [[-76.5, -52, 122.5], [-26.5, -53, -25.5], [-168.5, -53, 36.5], [164.5, -53, 4.5], [-108.5, -53, 38.5], [169.5, 60, -80.5], [-16.5, -52, -66.5], [296.5, -54, 11.5], [4.5, 58, 122.5], [88.5, 63, 69.5], [31.5, 43, 57.5], [-26.5, 6, 23.5], [-30.5, 47, -245.5], [-23.5, -52, -123.5]]

# The cast where kit bots cast (wall 33): the kit with the water bucket filled, at the eleven
# distinct pools (32 apart or more) where bots of the official kit race 44226112675 chose cast
# sites, most at the lava sea. Race it with 11 bots a lane, one a pool. The lava start's places
# lit 45% while kit bots casting at their own sites lit 1 of 22.
[[start]]
name = "kitlava"
stage = "iron_kit"
place = "spawn"
kit = [["iron_pickaxe", 1], ["bucket", 1], ["water_bucket", 1], ["flint_and_steel", 1], ["stone_pickaxe", 1], ["stone_sword", 1], ["crafting_table", 1], ["stick", 8], ["cobblestone", 16]]
cap_ticks = 24000
places = [[37.5, -52, -74.5], [195.5, 36, -165.5], [-32.5, 2, 5.5], [-64.5, -54, 23.5], [-16.5, -54, -87.5], [-63.5, -54, -96.5], [42.5, -55, -112.5], [61.5, -55, -178.5], [-147.5, -55, 88.5], [-26.5, -53, -119.5], [161.5, -49, -200.5]]

# A DEVELOPMENT start (issue 16, 2026-11-24; never issue-16 evidence, never the frontier): the cast
# at the lava sea with what a real bot from the `ready` snapshot holds when it gets there (race
# 45343519424 lanes 0 and 1 at their casts: "buckets water 2 lava 0 empty 1", 3 to 4 stone
# pickaxes, a table, hundreds of cobblestone and cobbled deepslate, cooked meat, iron armour and
# sword), at the kitlava places at the sea (y -52 to -55; its two higher places left out). Race it
# with goal `portal`, 9 bots a lane, one a place (docs/problems/cast.md).
[[start]]
name = "sealava"
stage = "iron_kit"
place = "spawn"
kit = [["stone_pickaxe", 4], ["bucket", 1], ["water_bucket", 2], ["flint_and_steel", 1], ["crafting_table", 1], ["stick", 16], ["cobblestone", 64], ["cobbled_deepslate", 64], ["cooked_porkchop", 16], ["iron_helmet", 1], ["iron_chestplate", 1], ["iron_leggings", 1], ["iron_sword", 1]]
cap_ticks = 24000
places = [[37.5, -52, -74.5], [-64.5, -54, 23.5], [-16.5, -54, -87.5], [-63.5, -54, -96.5], [42.5, -55, -112.5], [61.5, -55, -178.5], [-147.5, -55, 88.5], [-26.5, -53, -119.5], [161.5, -49, -200.5]]

# Issue 15's start: in the Nether where a portal near spawn leads (overworld casts within about
# 300 blocks of spawn come out within about 40 of (0, 0), the scale being 8), what an issue-14 bot
# holds after its cast (the iron pickaxe, the stone tools, flint and steel, the water bucket and
# the spare), 64 cobblestone as the building-block reserve the issue keeps, and food. Each bot to
# the highest safe floor under y 100 within 48 blocks (spread_under: never on the bedrock roof).
# The nearest fortress on the race seed is at (48, 176), 182 blocks off (locate, probe 44386934210:
# setup data only, never read by the bot).
[[start]]
name = "nether"
stage = "nether"
place = { dimension = "minecraft:the_nether", x = 0.5, y = 64, z = 0.5 }
kit = [["iron_pickaxe", 1], ["stone_pickaxe", 1], ["stone_sword", 1], ["flint_and_steel", 1], ["bucket", 1], ["water_bucket", 1], ["cobblestone", 64], ["cooked_beef", 16], ["crafting_table", 1], ["stick", 8]]
spread = 48
spread_under = 100

# Issue 15c's start: a lit portal beside each bot, so a race measures walking into it and arriving
# in the Nether, not the cast before it. The kit as `lava` (what a cast leaves); each bot spread as
# `kit`, then a 4x5 obsidian frame built 3 to 6 east of it along x and its inside set to
# nether_portal (axis x: the bot walks in from the north or south). Setup only: the bot finds the
# portal by sight, as it would its own.
[[start]]
name = "portal"
stage = "iron_kit"
place = "spawn"
kit = [["iron_pickaxe", 1], ["bucket", 1], ["water_bucket", 1], ["flint_and_steel", 1], ["stone_pickaxe", 1], ["stone_sword", 1], ["crafting_table", 1], ["stick", 8], ["cobblestone", 16]]
spread = 128
cap_ticks = 6000
setup = [
  "execute at {bot} run fill ~3 ~-1 ~ ~6 ~3 ~ minecraft:obsidian",
  "execute at {bot} run fill ~3 ~ ~-2 ~6 ~2 ~-1 minecraft:air",
  "execute at {bot} run fill ~3 ~ ~1 ~6 ~2 ~2 minecraft:air",
  "execute at {bot} run fill ~4 ~ ~ ~5 ~2 ~ minecraft:nether_portal[axis=x]",
]

# Resuming from a snapshot (one-bot-first, 2026-11-19): no kit and no place. The lane copies the
# snapshot's world and gives every bot the snapshot bot's player file (items, position, dimension,
# health) before the server starts, and the race seeds each bot with the snapshot's memory
# (race.yml's `snapshot` input).
[[start]]
name = "snapshot"
stage = "in_world"
place = "spawn"

# A development start for the blaze fight (issue 16, 2026-11-23): never issue-16 evidence and never
# the frontier (a made-up kit). Race it with
# `-f snapshot=race-44789031743/snapshot-spawner-44789031743-race-44789031743-lane-1.tar.zst`:
# that snapshot's world, memory and player file put the bot at (129.5, 61, 166.4) in the Nether, 7
# blocks from the blaze spawner at (129, 64, 159), up the stairs the snapshot bot cut. That bot was
# bare (a stone sword and pickaxe, a table, a bucket and a water bucket, flint and steel, 8 sticks,
# 28 cobblestone, 270 netherrack) at 6 to 7 health. The kit tops it up to what the equipped Nether
# snapshot of race 45194253932 holds (armour, an iron sword, four stone pickaxes, both buckets, 11
# meat), and the setup heals and feeds it, as a bot that arrives whole would be. No place: the
# snapshot's own.
[[start]]
name = "dev-spawner"
stage = "spawner"
place = "spawn"
kit = [["iron_helmet", 1], ["iron_chestplate", 1], ["iron_leggings", 1], ["iron_sword", 1], ["stone_pickaxe", 3], ["water_bucket", 1], ["beef", 6], ["porkchop", 5], ["stick", 5], ["cobblestone", 36]]
setup = [
  "effect give {bot} minecraft:instant_health 1 5",
  "effect give {bot} minecraft:saturation 1 10",
]

# A DEVELOPMENT start (2026-11-23; never issue-16 evidence, never the frontier): the old frontier
# fortress bot's world and place with the kit a real bot holds on arrival in the Nether. Race it
# only with `snapshot=race-44678197603/snapshot-fortress-44678197603-race-44678197603-lane-0.tar.zst`:
# the snapshot puts the bot at (22, 55, 129) in the Nether, in the tunnel a real bot dug to the
# fortress round (48, ~, 176), with that bot's memory, at 17 health and 17 food; the commands
# here then swap its bare kit for what rs-l05-b00 held in the equipped Nether snapshot of race
# 45194253932 (its `snap.toml`), less the overworld's stone. The planner puts the armour on
# (`Plan::equip`). No place: without the snapshot the bot would stand at the overworld spawn.
[[start]]
name = "dev-fortress"
stage = "fortress"
place = "spawn"
setup = [
  "clear {bot}",
  "give {bot} minecraft:iron_helmet 1",
  "give {bot} minecraft:iron_chestplate 1",
  "give {bot} minecraft:iron_leggings 1",
  "give {bot} minecraft:iron_sword 1",
  "give {bot} minecraft:stone_pickaxe 4",
  "give {bot} minecraft:crafting_table 1",
  "give {bot} minecraft:bucket 1",
  "give {bot} minecraft:water_bucket 2",
  "give {bot} minecraft:flint_and_steel 1",
  "give {bot} minecraft:beef 6",
  "give {bot} minecraft:porkchop 5",
  "give {bot} minecraft:stick 13",
  "give {bot} minecraft:cobblestone 64",
  "give {bot} minecraft:oak_log 2",
]

# A DEVELOPMENT start for the shield (issue 16, 2026-11-23; never issue-16 evidence, never the
# frontier): a shield put into the off hand of a bot resumed at the blaze spawner, to measure what
# a raised shield is worth before any crafting of one (docs/problems/shield.md). Race it only with
# `snapshot=race-45336326999/snapshot-spawner-45336326999-race-45336326999-lane-2.tar.zst` (the
# healthy armoured bot the blaze fight's race 45338756013 started from, so the two compare). No
# kit and no place: the snapshot's own. The 32 cooked beef are there so that the food a bot can
# carry does not hide what the shield does (the orchestrator, 2026-11-23); the two more shields are
# the spares a long fight wears through.
[[start]]
name = "dev-shield"
stage = "spawner"
place = "spawn"
setup = [
  "item replace entity {bot} weapon.offhand with minecraft:shield",
  "give {bot} minecraft:shield 2",
  "give {bot} minecraft:cooked_beef 32",
]

# A DEVELOPMENT start (2026-11-23; never issue-16 evidence, never the frontier): the blaze fight
# with the food ceiling taken away. Race it only with
# `snapshot=race-45336326999/snapshot-spawner-45336326999-race-45336326999-lane-2.tar.zst` (a bot
# that walked to the spawner with the real kit, armour worn, 20 health): its 10 raw meat healed
# about 26 health and one bot sat at 3.9 health with nothing to eat for 3,100 ticks (race
# 45338756013 lane 1; docs/problems/blaze-fight.md). 32 cooked beef on top says what the fight
# does when fed, and what its next wall is.
[[start]]
name = "dev-spawner-fed"
stage = "spawner"
place = "spawn"
kit = [["cooked_beef", 32]]

# A DEVELOPMENT start for the pearl hunt (issue 18, 2026-11-24; never issue-18 evidence, never the
# frontier): the frontier bot as it is (12.5 health, food 17, no food, no shield, the iron sword at
# 161 uses, 144 pickaxe uses, 7 rods, 7 raw iron and 1 coal) put in this world's nearest warped
# forest, so the forest base, the burrow and the hunt are developed while real bots travel there.
# Race it only with
# `snapshot=race-45481633896/snapshot-endermen-45481633896-race-45481633896-lane-3.tar.zst` (the
# frontier's world, memory and player file). The forest's place is development knowledge only
# (`locate biome` from the frontier, probe 45529738504, docs/problems/pearls-observe.md): warped
# forest at (488, -111), never read by the bot. That point stands on a nether fortress (race
# 45531362383: both bots burned on its bricks by tick 720), so the place is the forest floor a
# real bot saw from the deltas at x 474 to 480, y 37 to 46, z about 4 (race 45531577912 lane 1),
# 120 blocks south of the fortress. Each bot to the highest safe floor under y 80 within 8
# of it.
[[start]]
name = "dev-forest"
stage = "endermen"
place = { dimension = "minecraft:the_nether", x = 490.5, y = 45, z = 5.5 }
spread = 8
spread_under = 80

# DEVELOPMENT starts for issue 19 (2026-11-25; never issue-19 evidence, never the frontier): the
# pearls_12 frontier bot put on the overworld surface with its eyes made and food, so the eyes,
# the overland walk and the stronghold are developed while real bots travel home. Race them only
# with the frontier's snapshot (`snapshot=frontier`: its world, memory and player file). The
# places are development knowledge only (RCON `locate structure minecraft:stronghold`, probe
# 45685968956, docs/problems/eyes-observe.md): this world's stronghold at (1648, ~, -16), 1,537
# blocks east of the overworld portal near (113, -50, -105); never read by the bot.
# dev-overworld-eyes: the bot's old surface stairs at (55, 70, -133), where a real bot climbing
# from its portal comes out. Each bot to the surface within 16.
[[start]]
name = "dev-overworld-eyes"
stage = "pearls_12"
place = { dimension = "minecraft:overworld", x = 55.5, y = 70, z = -132.5 }
spread = 16
kit = [["ender_eye", 14], ["cooked_beef", 32], ["crafting_table", 1], ["stick", 8]]

# dev-stronghold: 150 blocks west of the located stronghold, on the surface within 16, for the
# dig into the portal room (19f).
[[start]]
name = "dev-stronghold"
stage = "pearls_12"
place = { dimension = "minecraft:overworld", x = 1498.5, y = 90, z = -15.5 }
spread = 16
