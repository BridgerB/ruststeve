# Checkpoint starts as data (brain/ruststeve/design/race-and-results.md): a kit and a place per
# stage, so every lane can play any stage (brain/oracle/handoff/cc-loop-rules.md, the checkpoint
# rule). Every issue adds its row before its gameplay. Items by registry name (no namespace).

[[start]]
name = "spawn"
stage = "in_world"
place = "spawn"

# Proves the kit path (issue 07a): the table stage's kit at spawn.
[[start]]
name = "table"
stage = "table"
place = "spawn"
kit = [["crafting_table", 1], ["oak_log", 4]]

# Issue 13's start: what an issue-12 bot holds when stone tools are made (the hour race's case
# files: a stone pickaxe and sword, the wooden pickaxe, the table carried on, logs, sticks and the
# cobblestone left over), at spawn.
[[start]]
name = "stone"
stage = "stone_pickaxe"
place = "spawn"
kit = [["stone_pickaxe", 1], ["stone_sword", 1], ["wooden_pickaxe", 1], ["crafting_table", 1], ["oak_log", 3], ["stick", 3], ["cobblestone", 4]]
