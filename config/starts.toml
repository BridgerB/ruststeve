# dev-end-arrival: the End's arrival cell (100.5, 49, 0.5) (ServerLevel's END_SPAWN_POINT). A
# /tp does not build the obsidian platform a portal does, so setup builds it as the game would
# (5x5 obsidian at y 48, air above).
[[start]]
name = "dev-end-arrival"
stage = "end"
place = { dimension = "minecraft:the_end", x = 100.5, y = 49, z = 0.5 }
kit = [["iron_sword", 1], ["stone_pickaxe", 3], ["cooked_beef", 32], ["cobblestone", 128], ["water_bucket", 1], ["iron_helmet", 1], ["iron_chestplate", 1], ["iron_leggings", 1], ["iron_boots", 1], ["shield", 1]]
setup = [
  "execute in minecraft:the_end run fill 98 48 -2 102 48 2 minecraft:obsidian",
  "execute in minecraft:the_end run fill 98 49 -2 102 51 2 minecraft:air",
]

