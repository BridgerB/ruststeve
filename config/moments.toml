# Issue 10b's rows, after the walks so the real world's holes come after every walk row. Each
# landing gets a dig of the block under the feet with FINISH late (tick 30: accepted, the block
# breaks, the bot drops into the hole and picks up the drop) and early (tick 5: under 0.7 of the
# progress, a delayed destroy the server finishes itself), and a craft in window 0 from items
# given at the start (planks from a log, sticks from two planks, a table from four). Three blocks
# off the centre diagonally, so no walk row crosses them. Items a block drops only by chance
# (a sapling from leaves, a seed from grass) are left out of the inventory class: the model's
# roll is not vanilla's, and the canopies a fresh server grows on the same seed differ from run to
# run (two runner captures disagree at landings 4 and 7). Seven rows stand off the first spots,
# chosen on an older capture.

