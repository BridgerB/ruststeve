# Issue 18's burrow (docs/problems/pearls-model.md): a level burrow one wide and two high, built of
# stone and running east: B the bot's cell, M the mouth east of it, O east of M where the enderman
# stands. Rows at Normal, each on its own landing 40 south of its centre. The arena rows (e04,
# e05, e08) start in M: a stone floor 19 by 13, walls four high, a glass roof at 4 (so no
# daylight teleport and no rain reach it, and no mob spawns in its light), the burrow in its west
# part: a solid stone block 4 long, 5 wide and 3 high with the 1 by 2 tunnel B, M in it (since
# parity 45535279839 the cells beside B and behind it are filled: with walls one thick they were 2
# from B, as O is, and the enderman paced round to them; the top of the roof is cell 3 over the
# floor, 3 from B, and under the glass only 1 high), laid shell first (floor, walls, glass, then the
# air inside, then the block round the tunnel, never over the bot) so water outside cannot flow in, an enderman 10 east of M with its AI. Script
# `burrow:<mode>` (bot::script::BurrowMode): from M stare at its eye until it is creepy, then
# (hold, strike) walk west into B and look at its torso, or (near) stay in M.
# - e04-mouth: it comes to O and stays; the bot in B is never hit.
# - e05-strike: the same with an iron sword, struck on a full charge from B: it dies; its loot
#   kept (a pearl 0 or 1 at O).
# - e06-roof: the bot in B looks at the eye of a calm enderman penned at O: M's roof cuts the line,
#   so neither stared (data 18) nor creepy.
# - e07-pickup-b, e07-pickup-m: an ender pearl at O is not picked up from B and is from M.
# - e08-near: the bot stays in M with the angry enderman at O. Planned to prove the depth matters;
#   on the real server (parity 45531046147) it is never hit: its blow needs a line of sight eye to
#   eye and M's roof cuts it (docs/problems/pearls-model.md, wall 1).

