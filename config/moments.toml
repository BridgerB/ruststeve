# The parity table's moments (brain/ruststeve/design/parity-table.md): 50 walking rows (issue 08), 30 dig and craft rows (issue 10b) and 25 stone and table rows (issue 11a), each a start on
# a captured landing (config/landings.toml), a script and a length. Run in real and against the
# server model, their outcome classes are compared field by field. Five starts per landing, six
# blocks apart, each walking away from the centre (yaw 0 south, 90 west, 180 north, 270 east),
# so bots running at once never touch (vanilla players push each other); 160 ticks (8 s) keeps a walk within the
# captured radius of 4 columns. Mobs join with issue 12; the real side runs peaceful.

