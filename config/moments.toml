# Issue 20's End rows (docs/problems/end-model.md), development setups by RCON, never evidence.
# Each on its own landing, 40 east and 40 north of its centre (off every other row's ground),
# at Normal (explosions, the dragon's head and endermen do nothing to a player on peaceful), the
# full iron set of 20c with boots. `report` writes <id>.<real|sim>.end.txt: health at each change,
# hits, blasts, crystals, dragons and endermen with their health, the watched cells' full states.
# - e01-frame: a ring of 12 frames facing out (a player-placed frame faces the player:
#   `EndPortalFrameBlock.getStateForPlacement`), 11 with an eye; the bot, holding one eye, uses it
#   on the 12th's top: the frame gains it and the 3x3 inside lights (end_portal). Parity
#   45864998071: the frame took the eye, the ring did not light. e01-frame-in: the same ring
#   with every frame facing in.
# - e02-enter: three end_portal cells laid east of the feet; the bot walks in: the_end, where?
# - e03-strike: a crystal on bedrock on an obsidian column (a spike's top, `SpikeFeature`), the
#   bot on an end stone pillar 3 off with end stone at 2 off at the feet and the eye: it strikes
#   by reach through the wall. Health lost, blocks left.
# - e03-bars: the same crystal in its cage (`SpikeFeature`'s iron bars, -2..2 round the column,
#   from the bedrock's level up 4, the roof the 4th, each bar's sides as worldgen sets them), no
#   wall but the bars: does the strike go through, and what does the blast do through them?
# - e03-cage-wall: the cage with the two bars at 2 off (feet, eye) swapped for end stone: the
#   crystal plan for a cage.
# - e03-open: the same crystal, no wall: what the blast does to an open stand (the control).
# - e04-gaze-N: e00-stare's pen (an enderman 12 east): the look 3 and 6 degrees aside of its
#   eye (`EnderMan.isLookingAtMe`'s cone at 12 is about 3.7), and straight down.
# - e05-head, e05-neck: a dragon (with its AI: a dragon with none never moves its parts,
#   parity 45864998071; sitting scanning: DragonPhase 6, yaw 0) whose head by the
#   jar's `EnderDragon.aiStep` part offsets lies 6.5 along (sin yaw, -cos yaw) and 1 down from
#   its feet: here 2.0 from the eye, out of its blow's box (the head's box grown by 1). The bot
#   strikes part 1 (the head) or 2 (the neck); the dragon's health says which landed and how
#   much (head the full blow, others /4 + 1).
# - e05-blow: the same dragon; the bot walks into the head's box against an end stone stop: the
#   blows it takes through full iron with boots.
# - e06-clutch-N: off a 21-high end stone pillar onto stone, pouring the water bucket below
#   while falling from N over the ground; e06-drop: the same fall with no bucket (the control).

