# Issue 11a's rows, after 10b's, on the five dry landings (0, 1, 2, 4, 7): digging and placing
# from water is issue 12's. Stone is laid under the feet (`set`: setblock in real, retried until
# the chunk is loaded; into the model's world in sim) and dug by hand (it breaks by the delayed
# destroy, 150 ticks, and drops nothing) or with a given wooden pickaxe held (23 ticks,
# cobblestone), FINISH late (30) or early (5). At a table: room is made east of the feet (stone
# under, air above), the given table placed there, opened, and a wooden pickaxe crafted in its 3x3
# grid; or a stone pickaxe and a sword. Each kind of row at its own offset, off the walk lines.

