# for 80 ticks and walks to the drop.
hostile_clear = 16.0
night_throws = false
# Ticks the look is held before the use (scoop's settle: the look reaches the server first).
settle_ticks = 2
# The eye spawns at the thrower's (x, y + 0.9, z) (the jar, probe 45685968956); a new eye within 3
# of that is the throw's own (clojurecraft's seen-within).
seen_within = 3.0
# The eye must be seen within 60 ticks of the use (clojurecraft's answer-ms, 3 s).
answer_ticks = 60
# It lives 81 ticks (the jar); followed at most 120.
flight_max = 120
# Positions skipped before the fit (the first may predate the first move), and the least the eye
# must fly on the plane for its line to count (clojurecraft's min-flight).
fit_skip = 2
min_flight = 1.0
# The least angular spread a line is given, degrees: the heading is the exact bearing with no curve
# (the jar), so only the positions' quantization is left; 0.2 is margin over it.
spread_floor_deg = 0.2
# The dropped item appears at the eye's last position with a small kick (the jar): within 3 on the
# plane, within 20 ticks (clojurecraft's drop-grace-ms, 1 s); else it shattered.
drop_radius = 3.0
drop_grace = 20
# The near rule (the jar): with the stronghold point within 12 on the plane the eye flies to it and
# descends; a sink of 1 under where it was first seen marks it, and the point is good to about 2.
near_radius = 12.0
near_sink = 1.0
near_err = 2.0
# Pickup (the brief, 19c.3): a routed walk to a drop within 24, the drop at the feet's height or up
# to 2 over (clojurecraft: picked only within 2 of the feet), given up after 600 ticks or 3 walks.
pickup_radius = 24.0
pickup_rise = 2
pickup_ticks = 600
pickup_walks = 3
# A drop that comes to rest more than 2 over the feet is given up at once (Q5's parity 45688030470:
# one of three drops rested on a canopy at feet +4; a pickup reaches about feet +2.3). At rest: its
# height unchanged for 8 ticks (positions arrive every 4 ticks there, so two updates).
rest_rise = 2.0
rest_ticks = 8
# A drop at rest 2 to 12 over the feet with filler held is fetched, not given up (the coordinator
# from Q4's overland races: both throws a bot made rested 9 up in a canopy, a pearl each): a walk
# to within 1.2 of its column on the plane (else a cut there: a pillar never starts further off), a
# pillar of held filler till the feet are within 1.5 under it (the pickup reaches about +2.3),
# leaves over the head dug through; a block every 4 ticks at most (a block update comes in one
# or two); given up after climb_ticks, and the pillar dug back down either way.
climb_rise_max = 12.0
climb_beside = 1.2
climb_within = 1.5
# With no walk to within 1.2 (Q4's race 45732530352 lane 0: NoPath, the drop 12 off): a level cut
# toward its column, 16 steps at most; the whole fetch given up after 600 ticks (the coordinator).
climb_ticks = 600
climb_every = 4
climb_cut_max = 16
# A cut's step (dug, a floor laid when none, then a straight step with no route: Q4's race
# 45740169100 lane 0, the step's walk had no path) given up past 60 ticks (three seconds).
climb_step_ticks = 60
# Where the eye drops from (Q5's parity 45688030470, 8 real throws): 12.15 out on the bearing and
# 8.18 over its spawn at feet + 0.9, so about 9.1 over the feet. A throw with a bearing waits for a
# spot whose column there, from the feet's level up to that point, holds no solid block seen.
apex_out = 12.0
apex_up = 9.1
# Before the first throw, which has no bearing to check (the coordinator, 2026-11-25): no log or
# leaf seen within 6 on the plane over the feet's level (a canopy that near could catch the drop),
# else a walk 16 to the side with the fewest, at most 4 walks before throwing anyway.
first_clear = 6
# The first throw's ring (Q4's race 45698008920, both lanes: throw 1's eye rested 9 up on a canopy
# about 12 out, past first_clear): each of the 8 sides, 10 to 14 out around the drop's 12, from the
# feet's level up 10 (the drop's 9.1 and a block over); any blocked side walks first.
ring_from = 10
ring_to = 14
ring_up = 10.0
open_walk = 16.0
open_walks_max = 4
# At most 4 throws (the plan, 19c.6: 0.8 eyes lost at one in five).
max_throws = 4
# Throw 2 once 200 out from throw 1 and 140 across its line (the coordinator from the jar's exact
# heading: about 150 across). At a 0.2 degree spread 1,500 off, 140 across gives about 75 along.
# The way there turns the bearing 45 degrees.
baseline = 200.0
baseline_across = 140.0
baseline_turn_deg = 45.0
# A refine only at the fix with no frame seen (the coordinator, 2026-11-25): within 64 of it, from
# the fix itself (no side spot); a further throw only from 150 off every earlier spot.
refine_from = 64.0
refine_offset = 0.0
final_within = 64.0
respot = 150.0
# Frames are looked for within 8 chunk columns (the view distance: the frames face the room's air).
frame_chunks = 8
# A due throw that waits, or a craft that cannot go on, is noted at most every 600 ticks.
note_every = 600
