# The goal table (brain/ruststeve/design/goal-table-and-needs.md): clojurecraft's goals.edn rows
# for issue 10, as data. A goal row says what it provides; `until` is the --goal name that puts it
# in play. A producer row (with `act`) is how a need is met; the planner adds one generated
# producer row per 2x2 recipe (plan::make). Needs and provides are `item:<name>` or
# `tag:<item tag>` with a count, planned in the order written.

[[goal]]
id = "wood"
priority = 1
until = "log"
doc = "hold one log"
provides = [["tag:logs", 1]]

[[goal]]
id = "kit"
priority = 2
until = "table"
# Sticks first: one log is four planks, and a table first spent all four before the sticks
# (clojurecraft issue #104).
doc = "four sticks, then a crafting table, from logs"
provides = [["item:stick", 4], ["item:crafting_table", 1]]

[[goal]]
id = "gather"
priority = 10
doc = "dig a log seen with an exposed face, in reach of a walk, and collect it"
provides = [["tag:logs", 1]]
act = "gather"

# Issue 11's rows (clojurecraft's goals.edn).

[[goal]]
id = "pickaxe"
priority = 3
until = "pickaxe"
doc = "a wooden pickaxe, placing a crafting table to make it"
provides = [["item:wooden_pickaxe", 1]]

[[goal]]
id = "cobblestone"
priority = 4
until = "cobblestone"
doc = "three cobblestone, dug with the wooden pickaxe"
provides = [["item:cobblestone", 3]]

[[goal]]
id = "stone-pickaxe"
priority = 6
until = "stone-pickaxe"
doc = "a stone pickaxe, from cobblestone and sticks in a placed crafting table"
provides = [["item:stone_pickaxe", 1]]

# Issue 11's done-condition holds a stone pickaxe; its scope adds the sword.
[[goal]]
id = "stone-tools"
priority = 6
until = "stone-tools"
doc = "a stone pickaxe, then a stone sword"
provides = [["item:stone_pickaxe", 1], ["item:stone_sword", 1]]

[[goal]]
id = "place-table"
priority = 10
doc = "put a held crafting table down near the player"
needs = [["item:crafting_table", 1]]
provides = [["block:crafting_table", 1]]
act = "place"
blocks = ["crafting_table"]

[[goal]]
id = "mine-stone"
priority = 10
doc = "dig the nearest exposed stone with a pickaxe, or cut stairs down to stone"
holds = [["item:wooden_pickaxe", 1]]
provides = [["item:cobblestone", 1]]
act = "mine"
blocks = ["stone"]

# Issue 13's rows (clojurecraft's goals.edn): the furnace, the iron kit, and the producers that
# mine coal, iron and gravel and dig flint out of gravel. The planner adds a smelt row per furnace
# recipe (its input, then fuel for one cook, then a furnace near).

[[goal]]
id = "furnace"
priority = 7
until = "furnace"
doc = "a furnace placed near, crafted from eight cobblestone in a placed crafting table"
provides = [["block:furnace", 1]]

[[goal]]
id = "ingots"
priority = 8
until = "ingots"
doc = "four iron ingots"
provides = [["item:iron_ingot", 4]]
spares = [["item:stick", 24]]

[[goal]]
id = "iron-pickaxe"
priority = 8
until = "iron-pickaxe"
doc = "an iron pickaxe, from three ingots and two sticks at a crafting table"
provides = [["item:iron_pickaxe", 1]]

[[goal]]
id = "bucket"
priority = 9
until = "bucket"
doc = "an empty bucket, from three iron ingots"
provides = [["item:bucket", 1]]

[[goal]]
id = "flint-and-steel"
priority = 11
until = "flint-and-steel"
doc = "flint and steel, from an iron ingot and flint dug out of gravel"
provides = [["item:flint_and_steel", 1]]

# Issue 13's done-condition: the kit (the water bucket is the portal's, issue 14).
[[goal]]
id = "iron-kit"
priority = 12
until = "iron-kit"
doc = "the iron kit: an iron pickaxe, a bucket, flint and steel"
provides = [["item:iron_pickaxe", 1], ["item:bucket", 1], ["item:flint_and_steel", 1]]
# Taken whenever exposed within 6, whatever is being planned: gravel for flint (ten tries on
# average), the kit's seven raw iron, coal for the smelts (docs/problems/iron-kit.md wall 13).
wants = [["item:gravel", 3], ["item:raw_iron", 7], ["item:coal", 2]]

# Issue 14b (clojurecraft's goals.edn): a bucket filled at surface water, never cave water, and
# what a portal cast spends that the iron kit does not hold.
[[goal]]
id = "water-bucket"
priority = 10
until = "water-bucket"
doc = "a bucket filled at surface water, never cave water"
provides = [["item:water_bucket", 1]]

[[goal]]
id = "portal-kit"
priority = 13
until = "portal-kit"
doc = "what a portal cast spends that the iron kit does not hold"
provides = [["item:water_bucket", 1], ["item:bucket", 1]]
spares = [["item:stick", 24]]

# The tools taken through the portal (blaze.md wall 18: race 45164371770 lane 4 stood in view of a
# fortress 110 blocks off when its one pickaxe broke, and the Nether has no wood). 4 stone pickaxes
# are some 520 digs: the stairs to a fortress and a cut around its spawner. The table is for the
# next pickaxe from sticks and blackstone over there.
[[goal]]
id = "nether-kit"
priority = 14
until = "nether-kit"
doc = "spare stone pickaxes and a crafting table held before the portal is entered"
provides = [["item:stone_pickaxe", 4], ["item:crafting_table", 1]]

# >>> shield (docs/problems/shield.md): shields for the blaze fight, made after the Nether kit's
# tools and only from what is held (`plan::shield::kit_row` picks the row by what the held iron
# and wood make; an act that would be a trip skips them with a note). One iron ingot and six
# planks each, at a table: a blaze's fireball that a raised shield meets deals nothing and lights
# nothing, where one that lands costs 6 to 9 health in iron armour. Two: a shield is 336 uses and
# a blocked fireball takes 6; with the timed raise one lasted about 5,000 ticks among three blazes
# (race 45345386828). In the off hand a shield still counts as held (window slot 45).
[[goal]]
id = "shield"
priority = 14
until = "shield"
doc = "one shield held before the portal is entered"
provides = [["item:shield", 1]]

[[goal]]
id = "shields"
priority = 14
until = "shields"
doc = "two shields held before the portal is entered"
provides = [["item:shield", 2]]
# <<< shield

# Issue 16's clean flow (Bridger, 2026-11-22): the race stocks logs above ground before it first
# goes down for iron, and again before the cast (plan::Plan::clean_flow). Every gear snapshot of
# race 44840801185 was a bot 40 to 70 blocks underground with 1 to 23 sticks and no logs, and walls
# 5 to 16 of docs/problems/blaze.md followed from it.
[[goal]]
id = "stock"
priority = 5
until = "stock"
doc = "logs held before going underground: sticks, tables and pickaxes for the whole trip"
provides = [["tag:logs", 12]]

# Issue 14c's done-condition (clojurecraft's portal row): the kit the cast spends (a water
# bucket, a bucket for the lava, flint and steel) held, then the cast at a site beside lava
# (plan::cast); met once a portal is lit.
# Issue 16's: iron armour and an iron sword before the Nether (Bridger, 2026-11-20: wither
# skeletons killed 5 of 7 bare bots at the fortress, race 44789031743; clojurecraft's Nether
# starts carried the same). Worn armour counts as held (window 0's slots 5 to 8).
[[goal]]
id = "gear"
priority = 13
until = "gear"
doc = "an iron helmet, chestplate and leggings and an iron sword, before the Nether"
provides = [["item:iron_helmet", 1], ["item:iron_chestplate", 1], ["item:iron_leggings", 1], ["item:iron_sword", 1]]
holds = [["tag:pickaxes", 1]]
# Twenty ingots of armour and two of sword, and coal to smelt them, taken whenever exposed near.
wants = [["item:raw_iron", 22], ["item:coal", 6]]

[[goal]]
id = "portal"
priority = 15
until = "portal"
doc = "a nether portal cast from lava and water into holes cut in the rock beside a lava pool"
provides = [["item:water_bucket", 1], ["item:bucket", 1], ["item:flint_and_steel", 1]]
holds = [["tag:pickaxes", 1]]
spares = [["item:stick", 24]]

[[goal]]
id = "fill-bucket"
priority = 10
doc = "scoop a surface water source with an empty bucket"
holds = [["tag:pickaxes", 1]]
spares = [["tag:pickaxes", 1]]
needs = [["item:bucket", 1]]
provides = [["item:water_bucket", 1]]
act = "scoop"

[[goal]]
id = "place-furnace"
priority = 10
doc = "put a held furnace down near the player"
needs = [["item:furnace", 1]]
provides = [["block:furnace", 1]]
act = "place"
blocks = ["furnace"]

[[goal]]
id = "mine-coal"
priority = 10
doc = "dig the nearest exposed coal ore with any pickaxe"
holds = [["tag:pickaxes", 1]]
spares = [["tag:pickaxes", 1]]
provides = [["item:coal", 1]]
act = "mine"
blocks = ["coal_ore", "deepslate_coal_ore"]
# The lowest feet height its stairs go to (clojurecraft's :goal/depth).
depth = 40

[[goal]]
id = "mine-iron"
priority = 10
doc = "dig the nearest exposed iron ore with a stone pickaxe"
holds = [["item:stone_pickaxe", 1]]
spares = [["item:stone_pickaxe", 1], ["item:stick", 24]]
provides = [["item:raw_iron", 1]]
act = "mine"
blocks = ["iron_ore", "deepslate_iron_ore"]
# 26.x iron is mostly in a band from y -24 to 56 that peaks at 16 (docs/problems/iron-kit.md).
depth = 16

[[goal]]
id = "dig-gravel"
priority = 10
doc = "dig the nearest exposed gravel"
holds = [["tag:pickaxes", 1]]
spares = [["tag:pickaxes", 1]]
provides = [["item:gravel", 1]]
act = "mine"
blocks = ["gravel"]
depth = 40

[[goal]]
id = "flint-from-gravel"
priority = 10
doc = "place a held gravel and dig it, again until it drops flint (the game's loot table: one time in ten)"
needs = [["item:gravel", 1]]
provides = [["item:flint", 1]]
act = "redig"
blocks = ["gravel"]

# Issue 12b's always-rows (clojurecraft's goals.edn, priority 0): checked every tick ahead of every
# goal, and after the aim is met; one in force cuts the task in hand (plan::escape).

[[always]]
id = "escape-water"
priority = 0
doc = "out of water onto dry land, before anything else"
trap = "water"

[[always]]
id = "escape-lava"
priority = 0
doc = "off lava onto footing, before anything else"
trap = "lava"

[[always]]
id = "escape-wall"
priority = 0
doc = "out of a block the eyes are in (a fallen gravel), dug out, before anything else"
trap = "wall"

[[always]]
id = "escape-fire"
priority = 0
doc = "out of a fire block the body touches, before anything else"
trap = "fire"

# Issue 12c's always-rows, after the escapes (clojurecraft's :eat and :hunt): eat under
# hungry_below with something safe held; with nothing, kill the nearest animal whose loot is safe
# food and pick it up (plan::eat, plan::hunt).

# Issue 12d's row, ahead of food (clojurecraft's :defend): a hostile mob within defend_radius is
# fought, or backed away from under danger_health and when it is one of never_fight
# (plan::defend).

[[always]]
id = "defend"
priority = 0
doc = "answer a hostile mob within defend_radius: fight it, or back away"
act = "defend"

[[always]]
id = "eat"
priority = 0
doc = "eat when the food the server sent is under hungry_below and something edible is held"
act = "eat"

[[always]]
id = "hunt"
priority = 0
doc = "food: hungry with nothing edible held, an animal that drops meat in reach of a walk"
act = "hunt"

[survival]
# Food under this is hunger to answer: six short of full, four below where health stops coming
# back by itself at 18 (clojurecraft's eat/hungry-below).
hungry_below = 14
# Hunger points of safe food held before a portal is entered (issue 16a, Bridger 2026-11-20: food
# first, then the Nether): the Nether has little to eat, and the heal between blaze fights needs
# food over 18. 32 was eight raw beef or porkchop, or about five cooked (clojurecraft held four
# items, blaze.clj food-reserve). 48 since the fight at the spawner was measured (2026-11-23,
# docs/problems/overworld-leg.md wall 4): a fireball costs 6 to 9 health in armour and healing 13
# health took 5 raw porkchops, and the bot arrived with about 8. 48 is 16 raw beef or porkchop.
# The `ready` stage's own bar stays 32 (world::stage::READY_FOOD).
food_reserve = 48
# Never eaten: what poisons or makes hungry, what teleports, a random effect, and golden apples
# (worth more than food) (clojurecraft's eat/unsafe).
unsafe_foods = ["rotten_flesh", "spider_eye", "pufferfish", "poisonous_potato", "chicken", "chorus_fruit", "suspicious_stew", "golden_apple", "enchanted_golden_apple"]
# Blocks from the feet an animal is hunted within; starving (food at or under 6, health no
# longer comes back) a server's whole view (clojurecraft's forage/hunt-radius, starving-radius).
hunt_radius = 24.0
starving_below = 6
starving_radius = 48.0
# A hostile this near is answered (clojurecraft's :defend row: within 4 blocks).
defend_radius = 4.0
# Never fight at or under this health: two zombie hits on Normal (3 each) and a margin of 2.
danger_health = 8.0
# A tool with fewer uses left is worn and no spare (clojurecraft window/spare-uses: a tunnel's twelve
# level steps dig about thirty). Blaze wall 7: a stone pickaxe with 13 uses counted as the spare.
spare_uses = 40
# Digs held (pickaxes' uses left, and 131 for each stone pickaxe the held wood and stone make) under
# this and the bot goes for wood from anywhere, while it can still dig its way to the trees
# (clojurecraft pearls.edn travel-reserve-digs: a stone pickaxe's uses). Blaze wall 7: every bot of
# race 45000585321 mined on underground until both pickaxes broke, 40 blocks of stone from a log.
travel_reserve_digs = 131
# The clean flow's numbers (issue 16). stock_logs: 12 logs are 48 planks, a table and the sticks
# for some twenty stone pickaxes (2,600 digs: the gear and kit trip of race 45071679507 broke 3 to
# 6 pickaxes a bot). provision_ticks: the clock for each stocking phase: logs for up to twice it,
# then animals for up to three times it in all (6,000 ticks is five game minutes; a treeless or
# empty place costs minutes, never the run).
stock_logs = 12
provision_ticks = 6000
# Pieces of meat held before the race goes down from the surface, the bot resumed from a ready
# snapshot too (docs/problems/overworld-leg.md wall 4): hunted for one provision_ticks, then every
# raw piece cooked in a furnace made on the spot, the fuel planks from held logs. 30: seven rods
# are about 14 blazes at 6 to 8 health a kill, some 100 health to heal, and a cooked piece heals
# about three times a raw one (8 hunger and 12.8 saturation against 3 and 1.8); ten raw pieces
# were gone after three blazes (agent A4's spawner races, 2026-11-23).
meat_stock = 30
# Iron ingots held when the cook phase ends, smelted from held raw iron in the same furnace: a
# shield is one ingot and six planks, the Nether kit wants two (a timed shield cut fireball hits
# from 3.1 to 0.6 per 1,000 ticks at the spawner: agent A11's race 45345386828), and one spare.
kit_ingots = 3
# Shields crafted from those ingots at the cook's table before the descent (one ingot and six
# planks each; docs/problems/overworld-leg.md wall 8): a development bot with a timed shield and
# cooked food took 7 rods at 20 health (agent A11's race 45347052453), and two because a shield
# is 336 uses and a blocked fireball takes 6. A made shield counts as an ingot of kit_ingots.
kit_shields = 2
# The portal is entered with this much safe food or more; under it the bot looks for animals only
# under the open sky and for provision_ticks at most (docs/problems/overworld-leg.md wall 3). 24 is
# the eight raw beef or porkchop the reserve was first counted as: the snapshot bot holds 36 and
# the bots of race 45204423376 stood at their portals with 21 to 30, two of them hunting at y -53
# for 24,000 ticks at 24 and 21. 36 since the reserve is 48: the trip down eats two to four pieces.
portal_food = 36
# Fewer stone pickaxes than this with spare_uses left and more are made from the pack before the
# next task, up to the nether-kit row's four (overworld-leg wall 2). Two: one in the hand and one
# for when it breaks inside a task (a cast digs up to 131 times; every bot of races 45194253932
# and 45204423376 that reached a cast spent 1,940 to 58,960 ticks holding no pickaxe).
spare_pickaxes = 2
# Dropped a stack at a time when fewer than six main slots (two until wall 21) are free, each kept to its count (blaze
# wall 13: lane 11 of race 45071679507 held eleven stacks of cobblestone and deepslate, dirt,
# granite, andesite and diorite in every slot, so a dig's drop went uncollected and the bucket
# could not be held for the cast). 64 cobblestone and deepslate cover stone tools, stairs' floors,
# seals and the cast's placed blocks; gravel is kept for flint; nothing else here is ever used.
junk = [
  ["cobblestone", 64], ["cobbled_deepslate", 64], ["dirt", 16], ["gravel", 8],
  ["andesite", 0], ["diorite", 0], ["granite", 0], ["tuff", 0], ["calcite", 0],
  ["smooth_basalt", 0], ["raw_copper", 0], ["lapis_lazuli", 0], ["glow_ink_sac", 0],
  ["rotten_flesh", 0], ["spider_eye", 0], ["bone", 0], ["leaf_litter", 0],
  # The hunt's by-products (overworld-leg wall 10: a cook-site bot's pack held eggs, feathers,
  # leather and three colours of wool when it filled and its crafts failed).
  ["egg", 0], ["feather", 0], ["leather", 0], ["string", 0], ["white_wool", 0],
  ["light_gray_wool", 0], ["gray_wool", 0], ["black_wool", 0], ["brown_wool", 0],
]
# Never fought, only backed away from: a creeper's blast does far more than any fight wins.
# Wither skeletons were here from 2026-11-20 (8 a hit and the wither effect killed 5 of 7 bare bots,
# race 44789031743) until an armoured bot met one: it walks as fast as the bot, so backing away
# never ends, and 2 of 2 died with no swing after 700 and 900 ticks of it (race 45334573113,
# docs/problems/spawner.md wall 1). Fought within defend_radius now, as a zombie is.
never_fight = ["creeper"]
# Mobs that shoot: answered within ranged_radius, closed in on and fought (skeleton arrows were
# the top killer underground in the iron races: docs/problems/iron-kit.md wall 16).
# Blazes too (issue 16): they shoot from up to 48, and are closed on and struck the same way.
ranged = ["skeleton", "stray", "bogged", "blaze"]
# A shooter beyond defend_radius is gone after only at this health or more: one fireball and the
# fire it lights take 5 to 7 (clojurecraft blaze.clj engage-health; a blaze run began a fight at
# 10.5 and died in it).
engage_health = 18.0
# Left alone until one of their kind hits the bot: a zombified piglin struck angers its whole group
# (11 of 112 bots of the first nether race died to piglins after defending against one), an
# enderman looked at or hit teleports in to fight (docs/problems/fortress.md wall 2).
neutral = ["zombified_piglin", "enderman"]
ranged_radius = 16.0
# A fight with a shooter that lands nothing for this long is given up: a blaze winds up for 60 ticks
# and fires for 12, so 100 ticks is one volley's worth of standing in the open for nothing. A fight
# held 300 ticks on a blaze sitting on a roof and cost 18 health (blaze-fight wall 2).
shooter_patience = 100
# A fight with a shooter backs off to cover at or under this health: the fire a fireball lights
# takes 4 to 5 more after the hit, so the danger line of 8 is met from 13 (a fight ended at 9.7 and
# the fire took it to 7.0: blaze-fight wall 3).
shooter_retreat_health = 13.0
# The parts of a shooter's fight, each on: stepping off a shooter within 2.4 (a blaze's touch is
# 3.6 in iron armour), stepping out of a fireball's line, and striking on the way down from a jump
# (9 for 6). Switched here so the whole-stage model can judge each alone
# (docs/problems/blaze-fight.md).
shooter_keep_off = true
shooter_dodge = true
shooter_crit = true
# A never_fight kind is backed away from within this: a creeper's fuse starts at 3 blocks, and
# backing away only within defend_radius let 7 creepers kill (docs/problems/iron-kit.md wall 21).
flee_radius = 8.0
# A retreat from a never_fight kind holds until past this, and work within it of where the mob was
# waits 600 ticks: a creeper follows its target from 16 blocks, and retreats that stopped at 12
# walked back to the same ore beside it until it blew (docs/problems/iron-kit.md wall 29).
flee_clear = 20.0
# Issue 17 (docs/problems/endermen-leave.md). travel_health: under it, with a ticking blaze or ghast
# seeing the bot, it rests in cover before the next leg: one fireball and its fire take 6 to 9 in
# iron (docs/problems/blaze-fight.md), so 14 leaves the danger line of 8 one hit away (the plan's
# starting figure; the frontier run left the spawner at 9.2 and lived).
travel_health = 14.0
# Pickaxe uses (the held pickaxes' uses summed) no leg of travel spends below: issue 18's burrow
# (a 2-high tunnel the enderman stops at) and the way out of trouble. Two stone pickaxes are at
# most 262 uses with no table or wood held (the rods_7 snapshots); 40 is one tunnel's level steps
# and a seal or two (spare_uses' figure). The heading (issue 17d) reads it too.
pickaxe_reserve = 40
# Ticks the bot stands in a warped forest with no ticking enderman within 32 before it goes on: a
# minute and a half of spawn attempts (the enderman is the forest's only monster, spawned in
# groups of 4 at 24 blocks or more within the ticking chunks; to be sized from issue 17a's spawn
# numbers).
forest_wait_ticks = 1800
# Issue 18c, the travel from the endermen pocket (docs/problems/pearls-travel.md): points (x, z)
# the heading runs to in turn until a warped forest is known from blocks seen. Known geography,
# not a sight: Bridger, 2026-11-24, allowed steering by the world's known geography to win. The
# nearest warped forest from the frontier is at (488, -111) (locate biome, probe 45529738504); it
# lies at x 470 to 540, z -127 to 49, north of the east axis behind basalt deltas from x 160
# (P1's strip map, docs/problems/pearls-observe.md). So east along the deltas first, where race
# 45531577912 lane 1 saw the forest from x 341 at z 64, then into it.
travel_way = [[440, 60], [488, -111]]
# Ticks the bot waits in its nook in a soul sand valley for an enderman to come within 32 before
# the heading (docs/problems/endermen.md, the decision of 2026-11-24): a valley spawns endermen 1 in
# 71 of its monsters, in fours; the census measured 1.75% of seconds with one within 32 in caves, a
# comparable rate, so ten game minutes are worth waiting before 450 blocks of travel.
valley_wait_ticks = 12000

# >>> pearls (P3, issue 18f, docs/problems/pearls-hunt.md): the hunt's numbers (plan::pearls).
[pearls]
# Twelve pearls: issue 19's twelve eyes (issue #23's done-condition).
pearls_wanted = 12
# Server ticks a stare from the mouth is held for the creepy flag: the jar angers 4 to 6 ticks
# after a held stare (probe 45472254333); clojurecraft's loaded servers took 1.7 to 5.1 s of wall
# time, which is server ticks under load: 60 is three times the jar's worst with room.
provoke_ticks = 60
# Eye to eye: within 4 an angry enderman stared at teleports away (jar), and stares from past 36
# angered none in clojurecraft's real races.
provoke_min = 6.0
provoke_max = 36.0
# With none in sight from M, a provoke from O at one this far or farther: the step back to B is two
# cells, some 10 ticks walking; an angry enderman walks within 16 (about 0.3 a tick) and teleports
# from past 16 after 15 goal ticks (the 26.1.2 jar), so 12 leaves it 30 ticks or more out.
provoke_out_min = 12.0
# Provokes on one enderman with no anger before it is skipped, and for how long (the plan's 18f).
provoke_tries = 3
provoke_skip_ticks = 2400
# A target in reach whose health has not fallen this long is noted: a full charge is 13 ticks with
# an iron sword, so 200 is fifteen swings with none landed.
fall_window = 200
# Out of reach this long is a parked target (clojurecraft's main stall: endermen jittered 1 to 2
# blocks off for up to 90 minutes); then a look from M, this many ticks, with no stare.
parked_ticks = 600
parked_look_ticks = 40
# A fight over this long is given up with the mouth sealed (the plan's 18f: about 300 to 450 ticks
# a kill expected, so 2,400 is five kills' time on one).
fight_cap = 2400
# A kill at least this often, else the burrow moves; two moves without a kill end the hunt (18f).
kill_window = 12000
moves_without_kill = 2
# No kill and no calm enderman in sight this long and the burrow moves, at least this far: P1's
# supply probe counted 18 endermen within 128 in 10 minutes and 0.4 new a minute, and the spot
# matters threefold over 10 blocks; three dev-forest bots waited 3,300 to 4,000 ticks for one in the
# mouth's sight (race 45534591345).
burrow_idle_ticks = 2400
burrow_move = 32
# Ticks between site searches (the plan's risk 8: 24 cells round, not every tick).
site_every = 100
# A weapon with this many uses or fewer is switched at once (18f).
weapon_min_uses = 10
# One step out of B this often without a kill or a pickup between (clojurecraft bounced between
# its burrow's end and mouth 119 to 1,241 times a run).
step_out_every = 1200
# Burrow blocks placed at one site before it is given up: 12 shell blocks and 2 floors, with room
# for support blocks and mends.
build_max = 40
# Walks to B before a site is given up (issue 17's CHASE_TRIES).
walk_tries = 3
# Pearls within this of O are collected, never farther than collect_reach from B (18f), each for
# at most collect_ticks; a hit knocks an enderman about 3 back (jar), so its drop lands near O.
collect_range = 6.0
collect_reach = 4.0
collect_ticks = 200
# An angry enderman this near with the bot out of B is a breach (18f); a breach's seal holds while
# one ticks within calm_range (the jar: within 16 it walks, past it teleports in).
breach_near = 4.0
calm_range = 16.0
# <<< pearls
# >>> base (P5, issue 18d, docs/problems/pearls-base.md): the forest base's rows, made where the
# bot stands in the warped forest before the first provoke (plan::base). Warped stems are in #logs
# and their planks in #planks, so the generated recipes make the table, sticks, swords, pickaxes
# and the shield from them. The repeated rows (all but base-table) make one more of their first
# provide than is held when a run begins; plan::base repeats a run while its step wants it.
[[goal]]
id = "base-table"
priority = 16
until = "base-table"
doc = "four sticks and a crafting table placed where the bot stands, from warped stems"
provides = [["item:stick", 4], ["block:crafting_table", 1]]

[[goal]]
id = "base-iron-sword"
priority = 16
until = "base-iron-sword"
doc = "one more iron sword: two ingots and a stick at the table"
provides = [["item:iron_sword", 1]]

[[goal]]
id = "base-stone-sword"
priority = 16
until = "base-stone-sword"
doc = "one more stone sword: two cobblestone and a stick at the table"
provides = [["item:stone_sword", 1]]

[[goal]]
id = "base-iron-pickaxe"
priority = 16
until = "base-iron-pickaxe"
doc = "one more iron pickaxe: three ingots and two sticks at the table"
provides = [["item:iron_pickaxe", 1]]

[[goal]]
id = "base-stone-pickaxe"
priority = 16
until = "base-stone-pickaxe"
doc = "one more stone pickaxe: three cobblestone and two sticks at the table"
provides = [["item:stone_pickaxe", 1]]

[[goal]]
id = "base-shield"
priority = 16
until = "base-shield"
doc = "one shield, for issue 19's trip back: six planks and an ingot at the table"
provides = [["item:shield", 1]]

[base]
# 8 stems are 32 planks: a table 4, a shield 6, sticks for eight tools 8, and spare (the plan,
# 18d.1). Stew is not a row: the warped forest places no nether mushrooms (P1's jar read).
logs = 8
# Twelve pearls at one in two (loot 0 to 1) are about 24 kills, about 31 for nine chances in ten
# (docs/problems/pearls.md); 30 kills' worth of swords besides the kill in hand.
kills = 30
# 40 health over the sword's damage: iron 6 is 7 hits, stone 5 is 8 (the plan, section 1).
hits_per_kill = [["iron_sword", 7], ["stone_sword", 8]]
# The hunt switches a sword under 10 uses (the plan, 18f's weapon invariant): it counts for nothing.
sword_floor = 10
# The pickaxe reserve (survival.pickaxe_reserve, 40) and 60 for the burrows and their mending.
pickaxe_uses = 100
# Free main slots kept: pearls need a slot (clojurecraft: a run with none free lost every pickup
# after the third), and the base's planks, sticks and tools want three more.
free_slots = 4
# Dropped first to keep them, never pearls, rods or eyes (plan::base::NEVER_DROP). Dirt is taken by
# endermen (P1's jar read: #enderman_holdable), so it is no burrow block either.
drop = ["granite", "tuff", "dirt", "diorite", "andesite", "calcite"]
# Each step ends done or given up within 2,400 ticks (two minutes) and 4 failed tasks (the plan,
# 18d's progress invariant).
step_ticks = 2400
step_fails = 4
# Stems within 24 flat of the feet (clojurecraft's search-radius) and 3 of their height: a huge
# fungus's lowest stems, dug from the floor beside them (the dig walk's PICKUP_RISE, 2).
stem_radius = 24
stem_rise = 2
note_every = 600
# <<< base
