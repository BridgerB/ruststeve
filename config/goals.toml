# The goal table (brain/ruststeve/design/goal-table-and-needs.md): clojurecraft's goals.edn rows
# for issue 10, as data. A goal row says what it provides; `until` is the --goal name that puts it
# in play. A producer row (with `act`) is how a need is met; the planner adds one generated
# producer row per 2x2 recipe (plan::make). Needs and provides are `item:<name>` or
# `tag:<item tag>` with a count, planned in the order written.

[[goal]]
id = "wood"
priority = 1
until = "log"
doc = "hold one log"
provides = [["tag:logs", 1]]

[[goal]]
id = "kit"
priority = 2
until = "table"
# Sticks first: one log is four planks, and a table first spent all four before the sticks
# (clojurecraft issue #104).
doc = "four sticks, then a crafting table, from logs"
provides = [["item:stick", 4], ["item:crafting_table", 1]]

[[goal]]
id = "gather"
priority = 10
doc = "dig a log seen with an exposed face, in reach of a walk, and collect it"
provides = [["tag:logs", 1]]
act = "gather"

# Issue 11's rows (clojurecraft's goals.edn).

[[goal]]
id = "pickaxe"
priority = 3
until = "pickaxe"
doc = "a wooden pickaxe, placing a crafting table to make it"
provides = [["item:wooden_pickaxe", 1]]

[[goal]]
id = "cobblestone"
priority = 4
until = "cobblestone"
doc = "three cobblestone, dug with the wooden pickaxe"
provides = [["item:cobblestone", 3]]

[[goal]]
id = "stone-pickaxe"
priority = 6
until = "stone-pickaxe"
doc = "a stone pickaxe, from cobblestone and sticks in a placed crafting table"
provides = [["item:stone_pickaxe", 1]]

# Issue 11's done-condition holds a stone pickaxe; its scope adds the sword.
[[goal]]
id = "stone-tools"
priority = 6
until = "stone-tools"
doc = "a stone pickaxe, then a stone sword"
provides = [["item:stone_pickaxe", 1], ["item:stone_sword", 1]]

[[goal]]
id = "place-table"
priority = 10
doc = "put a held crafting table down near the player"
needs = [["item:crafting_table", 1]]
provides = [["block:crafting_table", 1]]
act = "place"
blocks = ["crafting_table"]

[[goal]]
id = "mine-stone"
priority = 10
doc = "dig the nearest exposed stone with a pickaxe, or cut stairs down to stone"
holds = [["item:wooden_pickaxe", 1]]
provides = [["item:cobblestone", 1]]
act = "mine"
blocks = ["stone"]

# Issue 13's rows (clojurecraft's goals.edn): the furnace, the iron kit, and the producers that
# mine coal, iron and gravel and dig flint out of gravel. The planner adds a smelt row per furnace
# recipe (its input, then fuel for one cook, then a furnace near).

[[goal]]
id = "furnace"
priority = 7
until = "furnace"
doc = "a furnace placed near, crafted from eight cobblestone in a placed crafting table"
provides = [["block:furnace", 1]]

[[goal]]
id = "ingots"
priority = 8
until = "ingots"
doc = "four iron ingots"
provides = [["item:iron_ingot", 4]]
spares = [["item:stick", 24]]

[[goal]]
id = "iron-pickaxe"
priority = 8
until = "iron-pickaxe"
doc = "an iron pickaxe, from three ingots and two sticks at a crafting table"
provides = [["item:iron_pickaxe", 1]]

[[goal]]
id = "bucket"
priority = 9
until = "bucket"
doc = "an empty bucket, from three iron ingots"
provides = [["item:bucket", 1]]

[[goal]]
id = "flint-and-steel"
priority = 11
until = "flint-and-steel"
doc = "flint and steel, from an iron ingot and flint dug out of gravel"
provides = [["item:flint_and_steel", 1]]

# Issue 13's done-condition: the kit (the water bucket is the portal's, issue 14).
[[goal]]
id = "iron-kit"
priority = 12
until = "iron-kit"
doc = "the iron kit: an iron pickaxe, a bucket, flint and steel"
provides = [["item:iron_pickaxe", 1], ["item:bucket", 1], ["item:flint_and_steel", 1]]
# Taken whenever exposed within 6, whatever is being planned: gravel for flint (ten tries on
# average), the kit's seven raw iron, coal for the smelts (docs/problems/iron-kit.md wall 13).
wants = [["item:gravel", 3], ["item:raw_iron", 7], ["item:coal", 2]]

[[goal]]
id = "place-furnace"
priority = 10
doc = "put a held furnace down near the player"
needs = [["item:furnace", 1]]
provides = [["block:furnace", 1]]
act = "place"
blocks = ["furnace"]

[[goal]]
id = "mine-coal"
priority = 10
doc = "dig the nearest exposed coal ore with any pickaxe"
holds = [["tag:pickaxes", 1]]
spares = [["tag:pickaxes", 1]]
provides = [["item:coal", 1]]
act = "mine"
blocks = ["coal_ore", "deepslate_coal_ore"]
# The lowest feet height its stairs go to (clojurecraft's :goal/depth).
depth = 40

[[goal]]
id = "mine-iron"
priority = 10
doc = "dig the nearest exposed iron ore with a stone pickaxe"
holds = [["item:stone_pickaxe", 1]]
spares = [["item:stone_pickaxe", 1], ["item:stick", 24]]
provides = [["item:raw_iron", 1]]
act = "mine"
blocks = ["iron_ore", "deepslate_iron_ore"]
# 26.x iron is mostly in a band from y -24 to 56 that peaks at 16 (docs/problems/iron-kit.md).
depth = 16

[[goal]]
id = "dig-gravel"
priority = 10
doc = "dig the nearest exposed gravel"
holds = [["tag:pickaxes", 1]]
spares = [["tag:pickaxes", 1]]
provides = [["item:gravel", 1]]
act = "mine"
blocks = ["gravel"]
depth = 40

[[goal]]
id = "flint-from-gravel"
priority = 10
doc = "place a held gravel and dig it, again until it drops flint (the game's loot table: one time in ten)"
needs = [["item:gravel", 1]]
provides = [["item:flint", 1]]
act = "redig"
blocks = ["gravel"]

# Issue 12b's always-rows (clojurecraft's goals.edn, priority 0): checked every tick ahead of every
# goal, and after the aim is met; one in force cuts the task in hand (plan::escape).

[[always]]
id = "escape-water"
priority = 0
doc = "out of water onto dry land, before anything else"
trap = "water"

[[always]]
id = "escape-lava"
priority = 0
doc = "off lava onto footing, before anything else"
trap = "lava"

[[always]]
id = "escape-wall"
priority = 0
doc = "out of a block the eyes are in (a fallen gravel), dug out, before anything else"
trap = "wall"

[[always]]
id = "escape-fire"
priority = 0
doc = "out of a fire block the body touches, before anything else"
trap = "fire"

# Issue 12c's always-rows, after the escapes (clojurecraft's :eat and :hunt): eat under
# hungry_below with something safe held; with nothing, kill the nearest animal whose loot is safe
# food and pick it up (plan::eat, plan::hunt).

# Issue 12d's row, ahead of food (clojurecraft's :defend): a hostile mob within defend_radius is
# fought, or backed away from under danger_health and when it is one of never_fight
# (plan::defend).

[[always]]
id = "defend"
priority = 0
doc = "answer a hostile mob within defend_radius: fight it, or back away"
act = "defend"

[[always]]
id = "eat"
priority = 0
doc = "eat when the food the server sent is under hungry_below and something edible is held"
act = "eat"

[[always]]
id = "hunt"
priority = 0
doc = "food: hungry with nothing edible held, an animal that drops meat in reach of a walk"
act = "hunt"

[survival]
# Food under this is hunger to answer: six short of full, four below where health stops coming
# back by itself at 18 (clojurecraft's eat/hungry-below).
hungry_below = 14
# Never eaten: what poisons or makes hungry, what teleports, a random effect, and golden apples
# (worth more than food) (clojurecraft's eat/unsafe).
unsafe_foods = ["rotten_flesh", "spider_eye", "pufferfish", "poisonous_potato", "chicken", "chorus_fruit", "suspicious_stew", "golden_apple", "enchanted_golden_apple"]
# Blocks from the feet an animal is hunted within; starving (food at or under 6, health no
# longer comes back) a server's whole view (clojurecraft's forage/hunt-radius, starving-radius).
hunt_radius = 24.0
starving_below = 6
starving_radius = 48.0
# A hostile this near is answered (clojurecraft's :defend row: within 4 blocks).
defend_radius = 4.0
# Never fight at or under this health: two zombie hits on Normal (3 each) and a margin of 2.
danger_health = 8.0
# Never fought, only backed away from: a creeper's blast does far more than any fight wins.
never_fight = ["creeper"]
# Mobs that shoot: answered within ranged_radius, closed in on and fought (skeleton arrows were
# the top killer underground in the iron races: docs/problems/iron-kit.md wall 16).
ranged = ["skeleton", "stray", "bogged"]
ranged_radius = 16.0
# A never_fight kind is backed away from within this: a creeper's fuse starts at 3 blocks, and
# backing away only within defend_radius let 7 creepers kill (docs/problems/iron-kit.md wall 21).
flee_radius = 8.0
