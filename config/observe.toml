# What the bot hears from the server, classified (issue 16e, full observability).
#
# Every clientbound packet in the generated tables is exactly one of: decoded by
# `crates/protocol` (an `S2c` variant), `wanted` (sent by the server, still thrown away, and a
# blind spot until decoded: the race summary marks it `!!`), or `skipped` (thrown away on purpose,
# with the reason). The test `every_clientbound_packet_is_classified` in `crates/results` fails
# when a packet is in two lists, in none, or when a decoded one is still listed here, so a new
# game version cannot add a packet unseen. Names are `state/name` as the generated tables spell
# them. The lists began from clojurecraft's map of what its bot sensed (2026-11-06: hearing, the
# biggest blank) and its `deliberate` list.

# ---- wanted: the facts issues 16 to 20 need, still thrown away ----

