# --- the Nether's leftovers: [stronghold] junk, [fortress_way] junk and Q8 ---

# 64 in the overworld for the overland's bridges (bridge_keep 32, bridge_max 40; race
# 45695074789 lane 0 came up with 67 and took no cobblestone from nine stair legs).
[[item]]
name = "netherrack"
when = ["stronghold_aim"]
needs = [["win", 64]]

# 128 in the fortress tunnel: the trip's bridging and guards (HOME_FILLER_MAX 128; race
# 45766983995's tunnel filled the pack with 448).
[[item]]
name = "netherrack"
when = ["fortress_tunnel"]
needs = [["win", 128]]

# 192 on the home leg before the tunnel (plan::home::NETHERRACK_KEPT, Q8).
[[item]]
name = "netherrack"
when = ["home_leg"]
needs = [["win", 192]]

# 64 on the home leg before the tunnel, for the guard and the bridges (plan::home::BASALT_KEPT,
# Q8: the deltas' restock digs it). None elsewhere.
[[item]]
name = "basalt"
when = ["home_leg"]
needs = [["win", 64]]

[[item]]
name = "basalt"
when = ["stronghold_aim", "fortress_tunnel"]

# The [fortress_way] and Q8 lists' gravel 0: the always row's 16 comes first, as in the old
# find-first order, so this row never counts while that one stands.
[[item]]
name = "gravel"
when = ["fortress_tunnel", "home_leg"]

