# The keep rule (issue 77, brain/ruststeve/design/keep-rule.md): what a full pack drops first.
# One row per item and context. `needs` lists the stages that need the item and how many:
# a need counts while the run has not passed its stage (world::stage::Stage, by its results
# name, such as "bow_armed" or "win"). The count kept is the largest need still counting. An
# item no counting stage needs is surplus, and so is anything held over that count. Within the
# count it is needed, and the nearer stage the more. An item with no row is never dropped.
#
# `during` lists counts a stage uses while it runs (a leg's bridges and seals): only
# Keep::need_in reads it, for a stash (77-stash), and the drop rule never sees it (lead-77,
# 2026-11-28: changing rank to see in-leg needs is a later change, judged on races).
#
# `when` is where a row applies (plan::keep::Context, default ["always"]): the old drop gates,
# kept exactly (lead-77, 2026-11-27: widening them is a later change, judged on races).
#   always           the [survival] junk list: everywhere but in the overland hut
#   stronghold_aim   the [stronghold] junk list: the overworld with the stronghold the aim
#                    (an eye held or the room known)
#   fortress_tunnel  the [fortress_way] junk list (Q11): the Nether's home leg, tunnel begun
#   home_leg         the Q8 list: the Nether's home leg, top-up over, tunnel not begun
# For an item, the first context in that order with a row is the one that counts: the old
# lists' find-first order.
#
# The counts are the goals.toml junk lists' counts (no regression). plan::keep's tests hold
# them equal, and goals.toml keeps its lists for junk_place and the stone pressing. Change
# both together. This file is compiled into the planner (include_str!, commit-pinned): an edit
# needs a rebuild, unlike goals.toml.

# --- always: the [survival] junk list (goals.toml) ---

# 64 cover stone tools, stairs' floors, seals and the cast's placed blocks (blaze wall 13: the
# full pack that could not hold the bucket). Kept to the end, as the old list did.
[[item]]
name = "cobblestone"
needs = [["win", 64]]
# The Nether leg uses the same 64 (77-stash): stairs' floors and seals there.
during = [["nether", 64]]

[[item]]
name = "cobbled_deepslate"
needs = [["win", 64]]
during = [["nether", 64]]

# The old list's 16 (blaze wall 13).
[[item]]
name = "dirt"
needs = [["win", 16]]
during = [["nether", 16]]

# 16 for the flint redig (E8: the armed pack's 15).
[[item]]
name = "gravel"
needs = [["win", 16]]
# In the Nether, flint for a relight of the portal home (77-stash).
during = [["nether", 16]]

# The bow's (E8, race 46047707279 lane 1 dropped every feather of four chickens): 16 feathers
# and 8 string, kept to the end as the old list did. bow_armed is the bow line's own stage, so
# they rank as more needed than cobblestone until the bow is made.
[[item]]
name = "feather"
needs = [["bow_armed", 16], ["win", 16]]

[[item]]
name = "string"
needs = [["bow_armed", 8], ["win", 8]]

